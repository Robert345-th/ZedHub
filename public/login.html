<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Log in — Nexus</title>
  <meta name="theme-color" content="#c2410c" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/auth.css" />
  <script src="/no-ptr.js"></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <main class="auth-card">
    <img class="logo" src="/icons/icon-192.png" alt="" width="56" height="56" />
    <h1>Welcome back</h1>
    <p class="sub">Log in with the email you used for Nexus.</p>

    <div class="banner" id="banner" hidden></div>

    <label class="label" for="email">Email</label>
    <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" />

    <label class="label" for="password">Password</label>
    <input class="input" id="password" type="password" autocomplete="current-password" placeholder="Your password" />

    <button type="button" class="btn" id="submitBtn">Log in</button>
    <a class="link" href="/register.html">New here? Create an account</a>
  </main>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script>
    if (ZEAuth.isLoggedIn()) {
      const user = ZEAuth.getUser();
      if (user && user.email) location.replace("/");
      else ZEAuth.clearSession();
    }

    const banner = document.getElementById("banner");
    const submitBtn = document.getElementById("submitBtn");
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "/";

    function showError(msg) {
      banner.hidden = false;
      banner.className = "banner error";
      banner.textContent = msg;
    }

    submitBtn.addEventListener("click", async () => {
      banner.hidden = true;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        showError("Please enter your email and password.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in…";
      try {
        const data = await ZE.api("/auth/login-email", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        ZEAuth.setSession(data.token, data.user);
        location.replace(next.startsWith("/") && !next.startsWith("//") ? next : "/");
      } catch (err) {
        showError(err.message || "Could not log in.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
