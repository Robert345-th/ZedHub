<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Apps · Nexus</title>
  <meta name="theme-color" content="#134a32" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/home.css" />
</head>
<body>
  <header class="top">
    <div class="brand">Nexus</div>
    <p class="sub">Choose an app</p>
  </header>

  <main class="list" aria-label="Apps">
    <a class="row" href="/events/">
      <img class="icon-img" src="/icons/zedevents.png" alt="" width="44" height="44" />
      <span class="meta">
        <span class="name">Events</span>
        <span class="desc">Find services for weddings, parties &amp; more</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </a>

    <a class="row" href="https://zedmarket.app" target="_blank" rel="noopener noreferrer">
      <img class="icon-img" src="/icons/zedmarket.png" alt="" width="44" height="44" />
      <span class="meta">
        <span class="name">Market</span>
        <span class="desc">Buy &amp; sell — opens ZedMarket</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </main>

  <p class="foot">Tap an app to open it.</p>
</body>
</html>
