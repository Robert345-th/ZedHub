<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Fruits · Stages</title>
  <meta name="theme-color" content="#1a7a3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Fruits" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/icons/fruits.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="fruits.css" />
  <script src="/no-ptr.js"></script>
</head>
<body class="page-stages">
  <div class="sky" aria-hidden="true"></div>

  <header class="bar">
    <a class="back" href="/" aria-label="Back to Nexus">‹</a>
    <div class="title">Fruits</div>
    <div class="lives-pill" id="livesPill" title="Lives">♥ <span id="livesVal">5</span></div>
  </header>

  <main class="screen menu">
    <div class="stage-box">
      <div class="stage-head">
        <span>Stages</span>
        <span class="stage-meta" id="progressMeta">1/100</span>
      </div>
      <div class="map-grid" id="mapGrid"></div>
      <div class="stage-foot">
        <a class="foot-btn" id="dailyBtn" href="play.html?mode=daily">Daily</a>
        <a class="foot-btn" id="versusBtn" href="play.html?mode=versus">2P</a>
      </div>
    </div>
  </main>

  <script src="stages.js"></script>
</body>
</html>
