<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Rush · Nexus</title>
  <meta name="theme-color" content="#1a0f0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/icons/runner.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="game.css" />
  <script src="/no-ptr.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/": "./vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="back" href="/" aria-label="Back to Nexus">‹</a>
      <div class="brand-wrap">
        <span class="brand">Rush</span>
        <span class="brand-sub">Nexus</span>
      </div>
      <div class="bar-spacer"></div>
    </header>

    <main class="wrap">
      <div class="hud">
        <div class="stat score-stat">
          <span class="stat-label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat coin-stat">
          <span class="coin-icon" aria-hidden="true"></span>
          <strong id="coins">0</strong>
        </div>
        <div class="stat best-stat">
          <span class="stat-label">Best</span>
          <strong id="best">0</strong>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="touch-hint" id="hint">Get ready…</div>
        <div class="lane-glow" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet" role="dialog" aria-labelledby="overTitle">
      <div class="sheet-glow" aria-hidden="true"></div>
      <p class="sheet-kicker" id="overKicker">Ready</p>
      <h2 id="overTitle">Nexus Rush</h2>
      <p class="sheet-lead" id="overLead">Dash the lanes. Grab coins. Don’t eat a train.</p>
      <div class="sheet-scores" id="overScores" hidden>
        <div><span>Score</span><strong id="overScoreVal">0</strong></div>
        <div><span>Coins</span><strong id="overCoinsVal">0</strong></div>
      </div>
      <button type="button" class="cta" id="startBtn">Start run</button>
      <button type="button" class="cta" id="againBtn" hidden>Run again</button>
      <a class="link-back" href="/">Back to Nexus</a>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
