<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Rush · Nexus</title>
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/icons/runner.png" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="game.css" />
  <script src="/no-ptr.js"></script>
</head>
<body>
  <header class="bar">
    <a class="back" href="/">‹ Nexus</a>
    <div class="brand">Rush</div>
  </header>

  <main class="wrap">
    <div class="hud">
      <div class="pill"><span>Score</span><strong id="score">0</strong></div>
      <div class="pill"><span>Coins</span><strong id="coins">0</strong></div>
      <div class="pill"><span>Best</span><strong id="best">0</strong></div>
    </div>

    <div class="stage">
      <canvas id="canvas" width="390" height="640" aria-label="Rush runner"></canvas>
      <div class="touch-hint" id="hint">Swipe ← → · ↑ jump · ↓ slide</div>
    </div>

    <button type="button" class="btn primary" id="startBtn">Start run</button>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="card">
      <h2 id="overTitle">Wrecked!</h2>
      <p id="overScore">Score 0 · Coins 0</p>
      <button type="button" class="btn primary" id="againBtn">Run again</button>
      <a class="btn ghost" href="/">Back to Nexus</a>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
