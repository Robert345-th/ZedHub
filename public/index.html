<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nexus</title>
  <meta name="theme-color" content="#c2410c" />
  <meta name="description" content="Your apps in one place." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nexus" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/home.css" />
  <script src="/no-ptr.js"></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>

  <div class="splash" id="splash" aria-hidden="false">
    <div class="splash-nexus" id="splashNexus">
      <img src="/icons/icon-192.png" alt="Nexus" width="88" height="88" />
    </div>
    <div class="splash-savanna" id="splashSavanna" hidden>
      <p class="splash-powered">POWERED BY</p>
      <p class="splash-name">Savanna</p>
    </div>
  </div>

  <header class="top">
    <div class="brand-row">
      <img class="brand-logo" src="/icons/icon-192.png" alt="" width="40" height="40" />
      <div class="brand">Nexus</div>
    </div>
  </header>

  <nav class="cats" aria-label="Categories">
    <button type="button" class="cat active" data-cat="events">Events</button>
    <button type="button" class="cat" data-cat="market">Market</button>
    <button type="button" class="cat" data-cat="games">Games</button>
  </nav>

  <main class="grid" id="appGrid" aria-label="Apps"></main>

  <div class="download-bar" id="downloadBar">
    <button type="button" class="download-btn" id="downloadBtn">Install app</button>
    <p class="download-hint" id="downloadHint" hidden></p>
  </div>

  <template id="tpl-events">
    <a class="app" href="/events/">
      <img class="icon-img" src="/icons/zedevents.png" alt="" width="62" height="62" />
      <span class="label">Events</span>
    </a>
  </template>

  <template id="tpl-market">
    <a class="app" href="https://zedmarket.app" target="_blank" rel="noopener noreferrer">
      <img class="icon-img" src="/icons/zedmarket.png" alt="" width="62" height="62" />
      <span class="label">Market</span>
    </a>
  </template>

  <template id="tpl-games">
    <a class="app" href="/games/fruits/?mode=offline">
      <img class="icon-img" src="/icons/fruits.png" alt="" width="62" height="62" />
      <span class="label">Fruits</span>
    </a>
    <a class="app" href="/games/2048/">
      <img class="icon-img" src="/icons/2048.png" alt="" width="62" height="62" />
      <span class="label">2048</span>
    </a>
    <a class="app" href="/games/runner/">
      <img class="icon-img" src="/icons/runner.png" alt="" width="62" height="62" />
      <span class="label">Rush</span>
    </a>
  </template>

  <script src="/home.js"></script>
</body>
</html>
