<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedHub</title>
  <meta name="theme-color" content="#134a32" />
  <meta name="description" content="Your Zed apps in one place." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ZedHub" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/home.css" />
</head>
<body>
  <header class="top">
    <div class="brand">ZedHub</div>
    <p class="sub">Pick a category</p>
  </header>

  <nav class="cats" aria-label="Categories">
    <button type="button" class="cat active" data-cat="events">Events</button>
    <button type="button" class="cat" data-cat="market">Market</button>
    <button type="button" class="cat" data-cat="games">Games</button>
  </nav>

  <section class="intro" id="intro" aria-live="polite">
    <h2 class="intro-title" id="introTitle"></h2>
    <p class="intro-desc" id="introDesc"></p>
  </section>

  <main class="list" id="appList" aria-label="Apps"></main>

  <template id="tpl-events">
    <a class="row" href="/events/">
      <span class="icon events" aria-hidden="true">E</span>
      <span class="meta">
        <span class="name">Events</span>
        <span class="desc">Open the Events app</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </template>

  <template id="tpl-market">
    <a class="row" href="https://zedmarket.app" target="_blank" rel="noopener noreferrer">
      <span class="icon market" aria-hidden="true">M</span>
      <span class="meta">
        <span class="name">Market</span>
        <span class="desc">Open ZedMarket</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </template>

  <template id="tpl-games">
    <div class="empty">
      <div class="empty-title">No games yet</div>
      <div class="empty-desc">Games will be added here later.</div>
    </div>
  </template>

  <script src="/home.js"></script>
</body>
</html>
