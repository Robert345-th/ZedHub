<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nexus</title>
  <meta name="theme-color" content="#0b2e1f" />
  <meta name="description" content="Your apps in one place." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nexus" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/home.css" />
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">Nexus</div>
  </header>

  <nav class="cats" aria-label="Categories">
    <button type="button" class="cat active" data-cat="events">Events</button>
    <button type="button" class="cat" data-cat="market">Market</button>
    <button type="button" class="cat" data-cat="games">Games</button>
  </nav>

  <nav class="subcats" id="gameSubcats" aria-label="Game modes" hidden>
    <button type="button" class="cat sub active" data-game="online">Online</button>
    <button type="button" class="cat sub" data-game="offline">Offline</button>
  </nav>

  <p class="intro" id="introDesc"></p>

  <main class="grid" id="appGrid" aria-label="Apps"></main>

  <template id="tpl-events">
    <div class="app-card">
      <a class="app" href="/events/">
        <img class="icon-img" src="/icons/zedevents.png" alt="" width="62" height="62" />
        <span class="label">Events</span>
      </a>
      <button
        type="button"
        class="app-download"
        data-name="Events"
        data-href="/events/?install=1"
        data-icon="/icons/zedevents.png"
      >
        Download
      </button>
    </div>
  </template>

  <template id="tpl-market">
    <div class="app-card">
      <a class="app" href="https://zedmarket.app" target="_blank" rel="noopener noreferrer">
        <img class="icon-img" src="/icons/zedmarket.png" alt="" width="62" height="62" />
        <span class="label">Market</span>
      </a>
      <button
        type="button"
        class="app-download"
        data-name="Market"
        data-href="https://zedmarket.app"
        data-external="1"
        data-icon="/icons/zedmarket.png"
      >
        Download
      </button>
    </div>
  </template>

  <template id="tpl-online">
    <div class="app-card">
      <a class="app" href="/games/ludo/?mode=online">
        <img class="icon-img" src="/icons/ludo.png" alt="" width="62" height="62" />
        <span class="label">Ludo</span>
      </a>
      <button
        type="button"
        class="app-download"
        data-name="Ludo"
        data-href="/games/ludo/?mode=online&install=1"
        data-icon="/icons/ludo.png"
      >
        Download
      </button>
    </div>
  </template>

  <template id="tpl-offline">
    <div class="app-card">
      <a class="app" href="/games/ludo/?mode=offline">
        <img class="icon-img" src="/icons/ludo.png" alt="" width="62" height="62" />
        <span class="label">Ludo</span>
      </a>
      <button
        type="button"
        class="app-download"
        data-name="Ludo"
        data-href="/games/ludo/?mode=offline&install=1"
        data-icon="/icons/ludo.png"
      >
        Download
      </button>
    </div>
    <div class="app-card">
      <a class="app" href="/games/fruits/?mode=offline">
        <img class="icon-img" src="/icons/fruits.png" alt="" width="62" height="62" />
        <span class="label">Fruits</span>
      </a>
      <button
        type="button"
        class="app-download"
        data-name="Fruits"
        data-href="/games/fruits/?mode=offline&install=1"
        data-icon="/icons/fruits.png"
      >
        Download
      </button>
    </div>
  </template>

  <div class="install-sheet" id="installSheet" hidden>
    <div class="install-card" role="dialog" aria-labelledby="installTitle">
      <button type="button" class="install-close" id="installClose" aria-label="Close">×</button>
      <img class="install-icon" id="installIcon" src="" alt="" width="64" height="64" />
      <h2 id="installTitle">Download app</h2>
      <p id="installBody">Add this app to your home screen.</p>
      <ol class="install-steps" id="installSteps" hidden></ol>
      <button type="button" class="install-action" id="installAction">Download</button>
    </div>
  </div>

  <script src="/home.js"></script>
</body>
</html>
