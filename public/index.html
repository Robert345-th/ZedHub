<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Nexus</title>
  <meta name="theme-color" content="#c2410c" />
  <meta name="description" content="Your apps in one place." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nexus" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/home.css?v=56" />
  <script src="/no-ptr.js"></script>
  <style>
    /* Hide home until email session is proven (stops flash of Games on stale installs) */
    html.nexus-locked body > *:not(#authBoot) { visibility: hidden !important; }
    #authBoot {
      position: fixed; inset: 0; z-index: 99999;
      display: grid; place-items: center;
      background: #3b1208; color: #fff8f3;
      font-family: "DM Sans", system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    #authBoot[hidden] { display: none !important; }
    #authBoot a {
      display: inline-block; margin-top: 18px; padding: 14px 22px;
      background: #ea580c; color: #fff; font-weight: 700;
      text-decoration: none; border-radius: 14px;
    }
  </style>
  <script>
    (function () {
      document.documentElement.classList.add("nexus-locked");

      function hasEmailSession() {
        try {
          var token = localStorage.getItem("ze_token");
          var raw = localStorage.getItem("ze_user");
          var user = raw ? JSON.parse(raw) : null;
          return !!(token && user && user.email);
        } catch (e) {
          return false;
        }
      }

      function unlockHome() {
        document.documentElement.classList.remove("nexus-locked");
        var boot = document.getElementById("authBoot");
        if (boot) boot.hidden = true;
      }

      function goRegister() {
        location.replace("/register.html?v=56");
      }

      function finishGate() {
        try { localStorage.setItem("nexus_force_auth_v56", "1"); } catch (e) {}
        if (hasEmailSession()) unlockHome();
        else goRegister();
      }

      // Never block on service-worker cleanup — that was freezing "Opening sign up…"
      finishGate();

      // Best-effort cache wipe in the background (once)
      var wiped = false;
      try { wiped = localStorage.getItem("nexus_sw_wipe_v56") === "1"; } catch (e) {}
      if (!wiped && "serviceWorker" in navigator) {
        try { localStorage.setItem("nexus_sw_wipe_v56", "1"); } catch (e) {}
        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }),
          caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }),
        ]).catch(function () {});
      }
    })();
  </script>
</head>
<body>
  <div id="authBoot">
    <div>
      <p style="font-weight:700;font-size:1.2rem;margin-bottom:8px;">Nexus</p>
      <p style="opacity:0.8;font-size:0.95rem;">Opening sign up…</p>
      <a href="/register.html?v=56">Create account</a>
    </div>
  </div>

  <div class="wallpaper" aria-hidden="true"></div>

  <div class="splash" id="splash" aria-hidden="false">
    <div class="splash-nexus" id="splashNexus">
      <img src="/icons/icon-192.png" alt="Nexus" width="88" height="88" />
    </div>
    <div class="splash-savanna" id="splashSavanna" hidden>
      <p class="splash-powered">POWERED BY</p>
      <p class="splash-name">Savanna</p>
    </div>
  </div>

  <header class="top">
    <div class="brand-row">
      <img class="brand-logo" src="/icons/icon-192.png" alt="" width="40" height="40" />
      <div class="brand">Nexus</div>
    </div>
    <div class="home-coins" id="homeCoins" hidden>🪙 <strong>0</strong></div>
  </header>

  <nav class="cats" aria-label="Categories">
    <button type="button" class="cat active" data-cat="events">Events</button>
    <button type="button" class="cat" data-cat="games">Games</button>
  </nav>

  <main class="grid" id="appGrid" aria-label="Apps"></main>

  <div class="download-bar" id="downloadBar">
    <button type="button" class="download-btn" id="downloadBtn">Install app</button>
    <p class="download-hint" id="downloadHint" hidden></p>
  </div>

  <template id="tpl-events">
    <a class="app" href="/events/">
      <img class="icon-img" src="/icons/zedevents.png" alt="" width="62" height="62" />
      <span class="label">Events</span>
    </a>
  </template>

  <template id="tpl-games">
    <a class="app app-wide" href="/games/fruits/?mode=offline">
      <img class="icon-img" src="/icons/fruits.png" alt="" width="62" height="62" />
      <span class="label">Fruits</span>
      <span class="app-desc">Match &amp; clear 100 stages</span>
    </a>
    <a class="app app-wide" href="/games/words/">
      <img class="icon-img" src="/icons/words.png" alt="" width="62" height="62" />
      <span class="label">Words</span>
      <span class="app-desc">Find words by theme</span>
    </a>
  </template>

  <script src="/games/wallet.js?v=56"></script>
  <script src="/home.js?v=56"></script>
</body>
</html>
