<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedHub</title>
  <meta name="theme-color" content="#134a32" />
  <meta name="description" content="Your Zed apps in one place." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ZedHub" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/home.css" />
</head>
<body>
  <header class="top">
    <div class="brand">ZedHub</div>
    <p class="sub">Choose an app</p>
  </header>

  <main class="list" aria-label="Apps">
    <a class="row" href="/events/">
      <span class="icon events" aria-hidden="true">E</span>
      <span class="meta">
        <span class="name">Events</span>
        <span class="desc">Find services for weddings, parties &amp; more</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </a>

    <div class="row off" aria-disabled="true">
      <span class="icon market" aria-hidden="true">M</span>
      <span class="meta">
        <span class="name">Market</span>
        <span class="desc">Runs separately — not opened from Hub</span>
      </span>
      <span class="pill">Separate</span>
    </div>
  </main>

  <p class="foot">Tap an app to open it.</p>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
  </script>
</body>
</html>
