<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Shop - Events</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C; --cream: #FFF3E8;
      --warn-bg: #FFF3E0; --warn-text: #7A3E00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      height: 100%; overflow-y: auto; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 88px;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .topbar {
      background: var(--orange); padding: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { color: var(--cream); font-size: 20px; font-weight: 700; }
    .sub-brand { color: #FFD8B8; font-size: 12px; margin-top: 2px; }
    .sell-btn {
      background: #111; color: #F5C518; border: none;
      padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .wrap { padding: 14px; max-width: 560px; margin: 0 auto; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    .card h2 { font-size: 15px; margin-bottom: 6px; }
    .card p { font-size: 13px; color: var(--subtext); line-height: 1.4; margin-bottom: 12px; }
    .gallery {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px;
    }
    .gallery img {
      width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #FBEAD9;
    }
    .primary {
      display: block; width: 100%; text-align: center; border: 0; border-radius: 12px;
      padding: 12px; background: var(--orange); color: #fff; font-weight: 700; cursor: pointer;
    }
    .ghost {
      display: block; width: 100%; text-align: center; margin-top: 8px;
      border: 1px solid var(--border); border-radius: 12px; padding: 12px;
      background: #fff; font-weight: 700; cursor: pointer;
    }
    .banner {
      display: none; margin-bottom: 12px; padding: 12px 14px; border-radius: 10px;
      background: var(--warn-bg); color: var(--warn-text); font-size: 13px; font-weight: 600; line-height: 1.4;
    }
    .banner.show { display: block; }
    .meta { font-size: 12px; font-weight: 700; color: var(--orange); margin-bottom: 8px; }
    .meta.bad { color: #B42318; }
  </style>
  <script src="/no-ptr.js"></script>
</head>
<body data-nav-active="shop">
  <div class="topbar">
    <div>
      <div class="brand">My Shop</div>
      <div class="sub-brand" id="shopName">What you do</div>
    </div>
    <button class="sell-btn" type="button" onclick="location.href='/events/status.html'">Status</button>
  </div>

  <div class="wrap">
    <div class="banner" id="banner"></div>
    <div class="card">
      <h2>Photo gallery</h2>
      <p>Your shop page needs <strong>4-10 photos</strong> of what you do.</p>
      <div class="meta" id="photoMeta">Checking...</div>
      <div class="gallery" id="gallery"></div>
      <a class="primary" href="/events/shop-photos.html">Add / edit photos</a>
      <a class="ghost" id="viewPublic" href="#">View public shop page</a>
    </div>
  </div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script src="/events/js/bottom-nav.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/events/my-shop.html")) {
      /* redirected */
    } else {
      const user = ZEAuth.getUser();
      const banner = document.getElementById("banner");
      document.getElementById("shopName").textContent =
        user.business_name || user.name || "Your shop";
      document.getElementById("viewPublic").href =
        `/events/vendor.html?id=${encodeURIComponent(user.id)}`;

      if (!user.is_vendor && !user.business_name) {
        banner.textContent = "Tip: register your shop name, then add 4-10 photos.";
        banner.classList.add("show");
      }

      (async () => {
        const meta = document.getElementById("photoMeta");
        const gallery = document.getElementById("gallery");
        try {
          const res = await fetch(`/api/shops/${encodeURIComponent(user.id)}/gallery`);
          const data = res.ok ? await res.json() : { photos: [] };
          const photos = Array.isArray(data.photos) ? data.photos : [];
          const n = photos.length;
          if (n < 4) {
            meta.textContent = `${n}/10 photos - add at least 4`;
            meta.classList.add("bad");
            banner.textContent = "Your public shop page needs 4-10 photos of what you do.";
            banner.classList.add("show");
          } else {
            meta.textContent = `${n}/10 photos - ready`;
            meta.classList.remove("bad");
          }
          gallery.innerHTML = photos.slice(0, 8).map((url) =>
            `<img src="${url}" alt="" loading="lazy" />`
          ).join("") || "<p style='grid-column:1/-1;color:#5C5955;font-size:13px;'>No photos yet.</p>";
        } catch {
          meta.textContent = "Could not load gallery";
          meta.classList.add("bad");
        }
      })();
    }
  </script>
</body>
</html>
