<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents - Admin</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --black: #111111;
      --orange: #C2410C; --cream: #FFF3E8; --price-red: #A3131C;
      --green-btn: #2F4F3E; --thumb-bg: #E9E2D3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 24px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--orange); padding: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-button {
      width: 40px; height: 40px; padding: 0; background: none; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .back-button svg {
      width: 22px; height: 22px; stroke: var(--cream); fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-title { color: var(--cream); font-size: 18px; font-weight: 700; }
    .center-box {
      display: flex; align-items: center; justify-content: center;
      padding: 80px 24px; text-align: center;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--orange); border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-text { color: var(--price-red); font-weight: 600; }
    .tab-scroll { overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; background: var(--bg); }
    .tab-scroll::-webkit-scrollbar { display: none; }
    .tab-row { display: flex; padding: 12px; gap: 6px; }
    .tab-btn {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--subtext);
      white-space: nowrap; cursor: pointer; flex-shrink: 0;
    }
    .tab-btn.active { background: var(--orange); border-color: var(--orange); color: var(--cream); }
    .search-box { padding: 4px 14px 8px; max-width: 640px; margin: 0 auto; }
    .search-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; font-size: 14px;
    }
    .list { padding: 14px; max-width: 640px; margin: 0 auto; }
    .empty-text { text-align: center; color: var(--subtext); font-size: 13px; line-height: 1.45; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 10px;
    }
    .card-name, .card-title { font-size: 14px; font-weight: 700; }
    .card-sub { font-size: 12px; color: var(--subtext); margin-top: 2px; }
    .card-detail { font-size: 12px; margin-top: 6px; line-height: 1.45; }
    .card-price { font-size: 13px; color: var(--price-red); font-weight: 700; margin-top: 4px; }
    .photo-row { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
    .photo-row img {
      width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
      background: var(--thumb-bg); flex-shrink: 0;
    }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .approve-btn, .reject-btn, .view-btn {
      border: none; padding: 10px; border-radius: 10px;
      color: #fff; font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .approve-btn { flex: 1; background: var(--green-btn); }
    .reject-btn { flex: 1; background: var(--price-red); }
    .view-btn { background: var(--black); color: var(--cream); padding: 10px 16px; flex-shrink: 0; }
    .shop-app-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .shop-app-row-main { min-width: 0; flex: 1; }
    .view-link {
      margin-top: 6px; display: inline-block; font-size: 12px; color: var(--orange);
      font-weight: 600; cursor: pointer; background: none; border: none; padding: 0;
    }
    .detail-row { font-size: 12px; margin-top: 6px; line-height: 1.45; }
    .detail-label { font-weight: 700; color: var(--subtext); }
    .input-label {
      font-size: 11px; font-weight: 600; color: var(--subtext);
      margin-top: 12px; margin-bottom: 6px; text-transform: uppercase;
    }
    .broadcast-title-input, .broadcast-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; font-size: 13px;
    }
    .broadcast-input { min-height: 100px; resize: vertical; margin-top: 6px; }
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: var(--bg); width: 100%; max-width: 480px;
      border-radius: 20px 20px 0 0; padding: 20px 20px calc(16px + env(safe-area-inset-bottom, 0px));
      max-height: 85vh; overflow-y: auto;
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .modal-subtitle { font-size: 12px; color: var(--subtext); margin-bottom: 14px; }
    .modal-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; min-height: 90px; margin-bottom: 14px;
      font-size: 13px; resize: vertical;
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-cancel-btn, .modal-submit-btn {
      flex: 1; border-radius: 12px; padding: 13px; font-weight: 700; cursor: pointer; border: none;
    }
    .modal-cancel-btn { background: var(--card); border: 1px solid var(--border); color: var(--subtext); }
    .modal-submit-btn { background: var(--price-red); color: #fff; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back-button" type="button" onclick="history.back()" aria-label="Go back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="header-title">Admin</div>
  </div>

  <div id="app"><div class="center-box"><div class="spinner"></div></div></div>

  <div class="modal-overlay" id="shopAppModal">
    <div class="modal-box">
      <div class="modal-title">Vendor Application</div>
      <div class="modal-subtitle" id="shopAppModalSubtitle"></div>
      <div id="shopAppModalBody"></div>
      <div class="modal-actions" style="margin-top:14px;">
        <button class="modal-cancel-btn" type="button" id="shopAppCloseBtn">Close</button>
        <button class="approve-btn" type="button" id="shopAppApproveBtn" style="flex:1;">Approve</button>
        <button class="reject-btn" type="button" id="shopAppRejectBtn" style="flex:1;">Reject</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="rejectModal">
    <div class="modal-box">
      <div class="modal-title">Reject Application</div>
      <div class="modal-subtitle">This reason will be sent to the vendor.</div>
      <textarea class="modal-input" id="rejectReasonInput" placeholder="e.g. Shop address is incomplete"></textarea>
      <div class="modal-actions">
        <button class="modal-cancel-btn" type="button" id="rejectCancelBtn">Cancel</button>
        <button class="modal-submit-btn" type="button" id="rejectSubmitBtn">Reject</button>
      </div>
    </div>
  </div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script src="/events/js/ui.js"></script>
  <script>
    const app = document.getElementById("app");
    let tab = "services";
    let services = [], shopApps = [], users = [], reports = [], userReports = [];
    let userSearchText = "";
    let viewShopTargetId = null;
    let rejectTargetId = null;
    let rejectTargetType = "shop";

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function formatPhone(phone) {
      if (!phone) return "—";
      const digits = String(phone).replace(/\D/g, "");
      let local = digits.startsWith("260") ? digits.slice(3) : digits;
      if (local.startsWith("0")) local = local.slice(1);
      if (local.length === 9) {
        return `+260 ${local.slice(0, 3)} ${local.slice(3, 6)} ${local.slice(6)}`;
      }
      return phone;
    }

    function parsePhotos(photos) {
      if (!photos) return [];
      if (Array.isArray(photos)) return photos.filter(Boolean);
      if (typeof photos === "string") {
        try {
          const parsed = JSON.parse(photos);
          return Array.isArray(parsed) ? parsed.filter(Boolean) : [photos];
        } catch { return photos ? [photos] : []; }
      }
      return [];
    }

    function formatDate(value) {
      if (!value) return "";
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? "" : d.toLocaleString();
    }

    function sellingTypeLabel(type) {
      if (type === "shop") return "Shop only";
      if (type === "home") return "Home only";
      if (type === "both") return "Shop & home";
      return type || "";
    }

    function buildShopDetail(app) {
      const rows = [
        ["Business name", app.business_name],
        ["City / Province", [app.city, app.province].filter(Boolean).join(", ")],
        ["Selling type", sellingTypeLabel(app.selling_type)],
        ["Shop address", app.shop_address],
        ["Home address", app.home_address],
        ["Bio", app.business_bio],
      ].filter(([, v]) => v);
      let html = rows.map(([label, value]) =>
        `<div class="detail-row"><span class="detail-label">${esc(label)}:</span> ${esc(value)}</div>`
      ).join("");
      if (app.business_photo_url) {
        html += `<img src="${esc(app.business_photo_url)}" alt="" style="width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:10px;" />`;
      }
      return html;
    }

    async function loadAll() {
      const [svc, shops, usrs, reps, uReps] = await Promise.all([
        ZE.api("/admin/services/pending").catch(() => []),
        ZE.api("/admin/vendor-applications/pending").catch(() => []),
        ZE.api("/admin/users").catch(() => []),
        ZE.api("/admin/reports/pending").catch(() => []),
        ZE.api("/user-reports/pending").catch(() => []),
      ]);
      services = svc;
      shopApps = shops;
      users = usrs;
      reports = reps;
      userReports = uReps;
      render();
    }

    function render() {
      const tabs = [
        { key: "services", label: `Services (${services.length})` },
        { key: "shopApps", label: `Shop Apps (${shopApps.length})` },
        { key: "users", label: `Users (${users.length})` },
        { key: "reports", label: `Service Reports (${reports.length})` },
        { key: "userReports", label: `User Reports (${userReports.length})` },
        { key: "broadcast", label: "Broadcast" },
      ];

      app.innerHTML = `
        <div class="tab-scroll"><div class="tab-row">
          ${tabs.map((t) => `<button type="button" class="tab-btn ${tab === t.key ? "active" : ""}" data-tab="${t.key}">${t.label}</button>`).join("")}
        </div></div>
        <div id="tabContent"></div>`;

      app.querySelectorAll("[data-tab]").forEach((el) => {
        el.onclick = () => { tab = el.dataset.tab; render(); };
      });
      renderTabContent();
    }

    function renderTabContent() {
      const content = document.getElementById("tabContent");
      if (!content) return;

      if (tab === "services") {
        content.innerHTML = `<div class="list">${
          services.length ? services.map((item) => {
            const photos = parsePhotos(item.photos);
            const vendor = item.business_name || item.vendor_name || "Vendor";
            return `
              <div class="card">
                <div class="card-title">${esc(item.title)}</div>
                <div class="card-sub">${esc(vendor)} · ${esc(item.category || "Uncategorised")}</div>
                <div class="card-price">${ZE.formatPrice(item.price)}</div>
                <div class="card-detail">${esc(item.description || "No description.")}</div>
                <div class="card-sub" style="margin-top:8px;">Posted ${esc(formatDate(item.date_posted))}</div>
                ${photos.length ? `<div class="photo-row">${photos.slice(0, 4).map((url) => `<img src="${esc(url)}" alt="" loading="lazy" />`).join("")}</div>` : ""}
                <div class="card-actions">
                  <button class="approve-btn" type="button" data-approve-service="${item.id}">Approve</button>
                  <button class="reject-btn" type="button" data-reject-service="${item.id}">Reject</button>
                </div>
              </div>`;
          }).join("") : `<div class="empty-text">No services waiting for approval.</div>`
        }</div>`;
        content.querySelectorAll("[data-approve-service]").forEach((el) => {
          el.onclick = () => actService(el.dataset.approveService, "approve");
        });
        content.querySelectorAll("[data-reject-service]").forEach((el) => {
          el.onclick = () => actService(el.dataset.rejectService, "reject");
        });

      } else if (tab === "shopApps") {
        content.innerHTML = `<div class="list">${
          shopApps.length ? shopApps.map((s) => `
            <div class="card shop-app-row">
              <div class="shop-app-row-main">
                <div class="card-name">${esc(s.business_name || s.name)}</div>
                <div class="card-sub">${esc(s.name)} · ${esc(formatPhone(s.phone))}</div>
              </div>
              <button type="button" class="view-btn" data-view-shop="${s.id}">View</button>
            </div>`).join("") : `<div class="empty-text">No pending shop applications.</div>`
        }</div>`;
        content.querySelectorAll("[data-view-shop]").forEach((el) => {
          el.onclick = () => openShopDetail(el.dataset.viewShop);
        });

      } else if (tab === "users") {
        const filtered = users.filter((u) => {
          if (!userSearchText.trim()) return true;
          const q = userSearchText.toLowerCase();
          return (u.name || "").toLowerCase().includes(q) || (u.phone || "").includes(q);
        });
        content.innerHTML = `
          <div class="search-box"><input class="search-input" id="userSearchInput" placeholder="Search by name or phone..." value="${esc(userSearchText)}" /></div>
          <div class="list">${
            filtered.length ? filtered.map((u) => `
              <div class="card">
                <div class="card-name">${esc(u.name)}</div>
                <div class="card-sub">${esc(formatPhone(u.phone))}${u.is_vendor ? " · Vendor" : ""}</div>
                <button class="${u.is_suspended ? "approve-btn" : "reject-btn"}" type="button" style="margin-top:10px;width:100%;" data-toggle-suspend="${u.id}" data-suspended="${u.is_suspended}">
                  ${u.is_suspended ? "Unsuspend" : "Suspend"}
                </button>
              </div>`).join("") : `<div class="empty-text">No users match your search.</div>`
          }</div>`;
        const search = document.getElementById("userSearchInput");
        if (search) {
          search.oninput = (e) => { userSearchText = e.target.value; renderTabContent(); };
        }
        content.querySelectorAll("[data-toggle-suspend]").forEach((el) => {
          el.onclick = () => toggleSuspend(el.dataset.toggleSuspend, el.dataset.suspended === "true");
        });

      } else if (tab === "reports") {
        content.innerHTML = `<div class="list">${
          reports.length ? reports.map((r) => `
            <div class="card">
              <div class="card-name">${esc(r.title)}</div>
              <div class="card-sub">Reported by ${esc(r.reporter_name || "Unknown")}</div>
              <div class="card-detail">Reason: ${esc(r.reason)}</div>
              <button type="button" class="view-link" data-view-service="${r.service_id}">View service →</button>
              <div class="card-actions">
                <button class="approve-btn" type="button" data-dismiss-report="${r.id}">Dismiss</button>
                <button class="reject-btn" type="button" data-remove-service="${r.id}" data-service-id="${r.service_id}">Remove Service</button>
              </div>
            </div>`).join("") : `<div class="empty-text">No service reports.</div>`
        }</div>`;
        content.querySelectorAll("[data-view-service]").forEach((el) => {
          el.onclick = () => { location.href = `/events/service.html?id=${el.dataset.viewService}`; };
        });
        content.querySelectorAll("[data-dismiss-report]").forEach((el) => {
          el.onclick = () => dismissReport(el.dataset.dismissReport);
        });
        content.querySelectorAll("[data-remove-service]").forEach((el) => {
          el.onclick = () => removeReportedService(el.dataset.removeReport, el.dataset.serviceId);
        });

      } else if (tab === "userReports") {
        content.innerHTML = `<div class="list">${
          userReports.length ? userReports.map((r) => `
            <div class="card">
              <div class="card-name">Reported: ${esc(formatPhone(r.reported_phone))}</div>
              <div class="card-sub">Reported by ${esc(r.reporter_name || "Unknown")}</div>
              <div class="card-detail">Reason: ${esc(r.reason)}</div>
              ${r.matched_user_id
                ? `<div class="card-detail">Account: ${r.matched_user_suspended ? "Suspended" : "Active"}</div>`
                : `<div class="card-detail">No matching account found</div>`}
              <div class="card-actions">
                <button class="approve-btn" type="button" data-dismiss-ureport="${r.id}">Dismiss</button>
                ${r.matched_user_id && !r.matched_user_suspended
                  ? `<button class="reject-btn" type="button" data-suspend-user="${r.id}" data-user-id="${r.matched_user_id}">Suspend Account</button>`
                  : ""}
              </div>
            </div>`).join("") : `<div class="empty-text">No user reports.</div>`
        }</div>`;
        content.querySelectorAll("[data-dismiss-ureport]").forEach((el) => {
          el.onclick = () => dismissUserReport(el.dataset.dismissUreport);
        });
        content.querySelectorAll("[data-suspend-user]").forEach((el) => {
          el.onclick = () => suspendReportedUser(el.dataset.suspendUser, el.dataset.userId);
        });

      } else if (tab === "broadcast") {
        content.innerHTML = `
          <div class="list">
            <div class="input-label">Title</div>
            <input class="broadcast-title-input" id="broadcastTitleInput" value="📢 ZedEvents" />
            <div class="input-label">Message</div>
            <textarea class="broadcast-input" id="broadcastMessageInput" placeholder="Message to all users..."></textarea>
            <button class="approve-btn" type="button" id="sendBroadcastBtn" style="width:100%;margin-top:8px;">Send Broadcast</button>
          </div>`;
        document.getElementById("sendBroadcastBtn").onclick = sendBroadcast;
      }
    }

    function openShopDetail(id) {
      const item = shopApps.find((s) => String(s.id) === String(id));
      if (!item) return;
      viewShopTargetId = item.id;
      document.getElementById("shopAppModalSubtitle").textContent = `${item.name} · ${formatPhone(item.phone)}`;
      document.getElementById("shopAppModalBody").innerHTML = buildShopDetail(item);
      document.getElementById("shopAppModal").classList.add("open");
    }

    function closeShopDetail() {
      document.getElementById("shopAppModal").classList.remove("open");
      viewShopTargetId = null;
    }

    function openRejectModal(id, type) {
      rejectTargetId = id;
      rejectTargetType = type;
      document.getElementById("rejectReasonInput").value = "";
      document.getElementById("rejectModal").classList.add("open");
    }

    function closeRejectModal() {
      document.getElementById("rejectModal").classList.remove("open");
      rejectTargetId = null;
    }

    document.getElementById("shopAppCloseBtn").onclick = closeShopDetail;
    document.getElementById("shopAppApproveBtn").onclick = async () => {
      if (!viewShopTargetId) return;
      await approveShopApp(viewShopTargetId);
      closeShopDetail();
    };
    document.getElementById("shopAppRejectBtn").onclick = () => {
      if (!viewShopTargetId) return;
      openRejectModal(viewShopTargetId, "shop");
      closeShopDetail();
    };
    document.getElementById("rejectCancelBtn").onclick = closeRejectModal;
    document.getElementById("rejectSubmitBtn").onclick = submitReject;

    async function actService(id, action) {
      const item = services.find((s) => String(s.id) === String(id));
      const title = item?.title || "this service";
      const ok = await ZEUI.confirm({
        title: action === "approve" ? "Approve service?" : "Reject service?",
        message: action === "approve"
          ? `Approve "${title}"? It will appear on the home feed.`
          : `Reject "${title}"?`,
        okText: action === "approve" ? "Approve" : "Reject",
        danger: action === "reject",
      });
      if (!ok) return;
      try {
        await ZE.api(`/admin/services/${id}/${action}`, { method: "PUT" });
        services = services.filter((s) => String(s.id) !== String(id));
        ZEUI.toast(action === "approve" ? "Service approved." : "Service rejected.", "success");
        render();
      } catch (err) {
        ZEUI.error(err.message || "Could not update service.");
      }
    }

    async function approveShopApp(id) {
      try {
        await ZE.api(`/admin/vendor-applications/${id}/approve`, { method: "PUT" });
        shopApps = shopApps.filter((s) => String(s.id) !== String(id));
        ZEUI.toast("Shop approved.", "success");
        render();
      } catch (err) {
        ZEUI.error(err.message || "Could not approve shop.");
      }
    }

    async function submitReject() {
      if (!rejectTargetId) return;
      const reason = document.getElementById("rejectReasonInput").value.trim();
      try {
        await ZE.api(`/admin/vendor-applications/${rejectTargetId}/reject`, {
          method: "PUT",
          body: JSON.stringify({ reason }),
        });
        shopApps = shopApps.filter((s) => String(s.id) !== String(rejectTargetId));
        closeRejectModal();
        ZEUI.toast("Application rejected.", "success");
        render();
      } catch (err) {
        ZEUI.error(err.message || "Could not reject application.");
      }
    }

    async function toggleSuspend(userId, isSuspended) {
      const ok = await ZEUI.confirm({
        title: isSuspended ? "Unsuspend user?" : "Suspend user?",
        message: isSuspended ? "This user can log in again." : "This user will be blocked from the app.",
        okText: isSuspended ? "Unsuspend" : "Suspend",
        danger: !isSuspended,
      });
      if (!ok) return;
      try {
        await ZE.api(`/admin/users/${userId}/${isSuspended ? "unsuspend" : "suspend"}`, { method: "PUT" });
        await loadAll();
        ZEUI.toast(isSuspended ? "User unsuspended." : "User suspended.", "success");
      } catch (err) {
        ZEUI.error(err.message || "Could not update user.");
      }
    }

    async function dismissReport(id) {
      try {
        await ZE.api(`/admin/reports/${id}/dismiss`, { method: "PUT" });
        reports = reports.filter((r) => String(r.id) !== String(id));
        render();
        ZEUI.toast("Report dismissed.", "success");
      } catch (err) {
        ZEUI.error(err.message || "Could not dismiss report.");
      }
    }

    async function removeReportedService(reportId, serviceId) {
      const ok = await ZEUI.confirm({
        title: "Remove service?",
        message: "This permanently removes the reported service.",
        okText: "Remove",
        danger: true,
      });
      if (!ok) return;
      try {
        await ZE.api(`/services/${serviceId}`, { method: "DELETE" });
        await ZE.api(`/admin/reports/${reportId}/dismiss`, { method: "PUT" });
        reports = reports.filter((r) => String(r.id) !== String(reportId));
        render();
        ZEUI.toast("Service removed.", "success");
      } catch (err) {
        ZEUI.error(err.message || "Could not remove service.");
      }
    }

    async function dismissUserReport(id) {
      try {
        await ZE.api(`/user-reports/${id}/dismiss`, { method: "PUT" });
        userReports = userReports.filter((r) => String(r.id) !== String(id));
        render();
        ZEUI.toast("Report dismissed.", "success");
      } catch (err) {
        ZEUI.error(err.message || "Could not dismiss report.");
      }
    }

    async function suspendReportedUser(reportId, userId) {
      const ok = await ZEUI.confirm({
        title: "Suspend account?",
        message: "This will block the reported user from the app.",
        okText: "Suspend",
        danger: true,
      });
      if (!ok) return;
      try {
        await ZE.api(`/admin/users/${userId}/suspend`, { method: "PUT" });
        await ZE.api(`/user-reports/${reportId}/dismiss`, { method: "PUT" });
        userReports = userReports.filter((r) => String(r.id) !== String(reportId));
        render();
        ZEUI.toast("Account suspended.", "success");
      } catch (err) {
        ZEUI.error(err.message || "Could not suspend user.");
      }
    }

    async function sendBroadcast() {
      const title = document.getElementById("broadcastTitleInput").value;
      const message = document.getElementById("broadcastMessageInput").value.trim();
      if (!message) {
        ZEUI.error("Please type a message.");
        return;
      }
      const ok = await ZEUI.confirm({
        title: "Send broadcast?",
        message: "This sends a push notification to every user.",
        okText: "Send",
      });
      if (!ok) return;
      try {
        const data = await ZE.api("/admin/broadcast", {
          method: "POST",
          body: JSON.stringify({ title, message }),
        });
        ZEUI.toast(`Sent to ${data.notified} users.`, "success");
        document.getElementById("broadcastMessageInput").value = "";
      } catch (err) {
        ZEUI.error(err.message || "Could not send broadcast.");
      }
    }

    async function init() {
      if (!ZEAuth.requireLogin("/admin.html")) return;
      try {
        const me = await ZE.api("/auth/me");
        ZEAuth.setSession(ZEAuth.getToken(), me);
        if (!me.is_admin) {
          app.innerHTML = `<div class="center-box"><div class="error-text">Admin access only.</div></div>`;
          return;
        }
        await loadAll();
      } catch (err) {
        const cached = ZEAuth.getUser();
        if (cached?.is_admin) {
          await loadAll();
          return;
        }
        app.innerHTML = `<div class="center-box"><div class="error-text">${esc(err.message || "Could not verify admin access.")}</div></div>`;
      }
    }

    init();
  </script>
</body>
</html>
