<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents - Map</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C;
      --cream: #FFF3E8; --price-red: #A3131C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { height: 100%; overflow-y: auto; overscroll-behavior: none; }
    html, body { height: 100%; overscroll-behavior: none;}
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none;}
    .topbar {
      background: var(--orange); padding: 16px;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .back-button {
      width: 40px; height: 40px; padding: 0; background: none; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .back-button svg {
      width: 22px; height: 22px; stroke: var(--cream); fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-title { color: var(--cream); font-size: 18px; font-weight: 700; flex: 1; }
    .map-count { color: var(--cream); font-size: 11px; font-weight: 600; opacity: 0.85; }
    .filter-row { display: flex; gap: 8px; padding: 12px; flex-shrink: 0; }
    .search-input {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; font-size: 13px;
    }
    .radius-box {
      display: flex; align-items: center; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; gap: 4px;
    }
    .radius-input { width: 36px; font-size: 13px; text-align: center; border: none; background: none; }
    .radius-label { font-size: 11px; color: var(--subtext); font-weight: 600; }
    .no-location-text {
      font-size: 11px; color: var(--price-red); text-align: center;
      padding: 0 12px 6px; flex-shrink: 0;
    }
    #map { flex: 1; width: 100%; }
  </style>
  <script src="/no-ptr.js"></script>
</head>
<body>
  <div class="topbar">
    <button class="back-button" type="button" onclick="history.back()" aria-label="Go back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="header-title">Map</div>
    <div class="map-count" id="mapCount"></div>
  </div>

  <div class="filter-row">
    <input class="search-input" id="searchInput" type="search" placeholder="Search services..." />
    <div class="radius-box">
      <input class="radius-input" id="radiusInput" value="25" inputmode="numeric" />
      <div class="radius-label">km</div>
    </div>
  </div>
  <div class="no-location-text" id="noLocationText" style="display:none;">
    Enable location to filter by distance — showing all mapped services for now.
  </div>

  <div id="map"></div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/location.js"></script>
  <script>
    let allServices = [];
    let myCoords = ZELocation.getSavedCoords();
    let map, markersLayer;

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function loadServices() {
      const rows = await ZE.api("/services");
      allServices = rows.filter((item) => {
        const lat = parseFloat(item.latitude);
        const lng = parseFloat(item.longitude);
        return Number.isFinite(lat) && Number.isFinite(lng);
      });
      document.getElementById("mapCount").textContent = `${allServices.length} on map`;
      initMap();
      renderMarkers();
    }

    function loadLocation() {
      if (myCoords) return;
      ZELocation.getDeviceCoords()
        .then((coords) => {
          myCoords = coords;
          ZELocation.saveCoords(coords);
          renderMarkers();
        })
        .catch(() => {
          document.getElementById("noLocationText").style.display = "block";
        });
    }

    function initMap() {
      const center = myCoords || (allServices[0]
        ? { lat: parseFloat(allServices[0].latitude), lng: parseFloat(allServices[0].longitude) }
        : { lat: -15.3875, lng: 28.3228 });
      if (map) {
        map.setView([center.lat, center.lng], 12);
        return;
      }
      map = L.map("map").setView([center.lat, center.lng], 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }

    function getFiltered() {
      const searchText = document.getElementById("searchInput").value.trim().toLowerCase();
      const radius = parseFloat(document.getElementById("radiusInput").value) || 25;
      let filtered = allServices.filter((item) =>
        !searchText || `${item.title || ""} ${item.category || ""}`.toLowerCase().includes(searchText)
      );
      if (myCoords) {
        filtered = filtered.filter((item) => {
          const dist = ZELocation.getDistanceKm(
            myCoords.lat, myCoords.lng,
            parseFloat(item.latitude), parseFloat(item.longitude)
          );
          return dist <= radius;
        });
      }
      return filtered;
    }

    function renderMarkers() {
      if (!map || !markersLayer) return;
      markersLayer.clearLayers();
      const filtered = getFiltered();

      if (myCoords) {
        L.circleMarker([myCoords.lat, myCoords.lng], {
          radius: 8, color: "#111", fillColor: "#F5C518", fillOpacity: 1,
        }).addTo(markersLayer).bindPopup("You are here");
      }

      filtered.forEach((item) => {
        const photo = ZE.firstPhoto(item.photos);
        const popupHtml = `
          <div style="width:150px">
            ${photo ? `<img src="${esc(photo)}" alt="" style="width:100%;height:80px;object-fit:cover;border-radius:6px;margin-bottom:4px;" />` : ""}
            <div style="font-weight:700;color:#C2410C;font-size:13px;">${esc(ZE.formatPrice(item.price))}</div>
            <div style="font-size:11px;color:#211D1A;margin-bottom:4px;">${esc(item.title)}</div>
            <button type="button" onclick="window.location.href='/events/service.html?id=${item.id}'" style="background:#111;color:#F5C518;border:none;padding:5px 10px;border-radius:8px;font-size:11px;cursor:pointer;">View</button>
          </div>`;
        L.marker([parseFloat(item.latitude), parseFloat(item.longitude)])
          .addTo(markersLayer)
          .bindPopup(popupHtml);
      });
    }

    document.getElementById("searchInput").addEventListener("input", renderMarkers);
    document.getElementById("radiusInput").addEventListener("input", renderMarkers);

    loadLocation();
    loadServices().catch(() => {
      initMap();
      document.getElementById("mapCount").textContent = "Could not load";
    });
  </script>
</body>
</html>
