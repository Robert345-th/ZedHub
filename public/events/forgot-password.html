<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedEvents - Forgot Password</title>
<meta name="theme-color" content="#C2410C" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --orange: #C2410C; --price-red: #A3131C; --cream: #FFF3E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { height: 100%; overflow-y: auto; overscroll-behavior: none; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none;}
  .content { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 480px; margin: 0 auto; }
  .title { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--subtext); margin-bottom: 28px; }
  .label { font-size: 12px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
  .phone-row { display: flex; margin-bottom: 18px; gap: 8px; }
  .phone-prefix { background: var(--orange); border-radius: 10px; padding: 0 12px; display: flex; align-items: center; }
  .phone-prefix span { color: var(--cream); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .phone-input, .field-input { flex: 1; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; margin-bottom: 14px; }
  .submit-btn { width: 100%; background: var(--orange); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .link { display: block; text-align: center; color: var(--orange); margin-top: 20px; font-size: 13px; text-decoration: none; }
  .form-banner { display: none; border-radius: 10px; padding: 11px 14px; font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .form-banner.error { background: #FBE7E8; color: var(--price-red); border: 1px solid #F0C1C4; }
  .form-banner.success { background: #E7F5EC; color: #1F7A43; border: 1px solid #BFE5CE; }
  .form-banner.show { display: block; }
  .panel { display: none; }
  .panel.active { display: block; }
</style>
  <script src="/no-ptr.js"></script>
</head>
<body>
<div class="content">
  <div class="title">Forgot Password</div>
  <div class="subtitle" id="sub">Enter your phone to get a reset code</div>
  <div class="form-banner error" id="errorBanner"></div>
  <div class="form-banner success" id="successBanner"></div>

  <div class="panel active" id="stepPhone">
    <div class="label">Phone Number</div>
    <input class="field-input" id="phone" placeholder="+260 97… (include country code)" inputmode="tel" />
    <button class="submit-btn" id="sendBtn" type="button">Send Code</button>
  </div>

  <div class="panel" id="stepReset">
    <div class="label">Code</div>
    <input class="field-input" id="otp" maxlength="6" inputmode="numeric" />
    <div class="label">New Password</div>
    <input class="field-input" id="password" type="password" maxlength="15" />
    <div class="label">Confirm Password</div>
    <input class="field-input" id="confirm" type="password" maxlength="15" />
    <button class="submit-btn" id="resetBtn" type="button">Reset Password</button>
  </div>

  <a class="link" href="/login.html">Back to login</a>
</div>

<script src="/events/js/api.js"></script>
<script src="/events/js/phone.js"></script>
<script>
  const errorBanner = document.getElementById("errorBanner");
  const successBanner = document.getElementById("successBanner");
  let phone = "";

  function showError(m) { successBanner.classList.remove("show"); errorBanner.textContent = m; errorBanner.classList.add("show"); }
  function showSuccess(m) { errorBanner.classList.remove("show"); successBanner.textContent = m; successBanner.classList.add("show"); }

  document.getElementById("sendBtn").addEventListener("click", async () => {
    phone = normalizePhone(document.getElementById("phone").value);
    if (!isValidPhone(phone)) { showError("Enter a valid phone with country code (e.g. +260…)."); return; }
    try {
      await ZE.api("/auth/forgot-password", { method: "POST", body: JSON.stringify({ phone }) });
      document.getElementById("stepPhone").classList.remove("active");
      document.getElementById("stepReset").classList.add("active");
      document.getElementById("sub").textContent = `Enter the code sent to ${phone}`;
      showSuccess("Code sent.");
    } catch (err) {
      showError(err.message || "Could not send code.");
    }
  });

  document.getElementById("resetBtn").addEventListener("click", async () => {
    const otp = document.getElementById("otp").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm").value;
    if (!otp || !password) { showError("Enter code and new password."); return; }
    if (password.length < 8 || password.length > 15) { showError("Password must be 8–15 characters."); return; }
    if (password !== confirmPassword) { showError("Passwords do not match."); return; }
    try {
      await ZE.api("/auth/reset-password", {
        method: "POST",
        body: JSON.stringify({ phone, otp, newPassword: password, confirmNewPassword: confirmPassword }),
      });
      showSuccess("Password updated. You can log in now.");
      setTimeout(() => { location.href = "/login.html"; }, 1000);
    } catch (err) {
      showError(err.message || "Could not reset password.");
    }
  });
</script>
</body>
</html>
