<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedEvents - Verify Phone</title>
<meta name="theme-color" content="#C2410C" />
<link rel="manifest" href="/manifest.json" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --orange: #C2410C; --price-red: #A3131C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { height: 100%; overflow-y: auto; overscroll-behavior: none; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none;}
  .content { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 480px; margin: 0 auto; }
  .title { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--subtext); margin-bottom: 28px; }
  .otp-input {
    width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 20px; font-size: 24px; text-align: center; letter-spacing: 8px;
  }
  .submit-btn { width: 100%; background: var(--orange); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 20px; }
  .submit-btn:disabled { opacity: 0.7; }
  .link { display: block; width: 100%; text-align: center; color: var(--orange); font-size: 13px; background: none; border: none; cursor: pointer; }
  .form-banner { display: none; border-radius: 10px; padding: 11px 14px; font-size: 13px; font-weight: 600; margin-bottom: 18px; line-height: 1.4; }
  .form-banner.error { background: #FBE7E8; color: var(--price-red); border: 1px solid #F0C1C4; }
  .form-banner.success { background: #E7F5EC; color: #1F7A43; border: 1px solid #BFE5CE; }
  .form-banner.show { display: block; }
</style>
  <script src="/no-ptr.js"></script>
</head>
<body>
<div class="content">
  <div class="title">Verify Your Phone</div>
  <div class="subtitle" id="subtitleText">Enter the 6-digit code sent to your phone</div>

  <div class="form-banner error" id="errorBanner"></div>
  <div class="form-banner success" id="successBanner"></div>

  <input class="otp-input" id="otpInput" placeholder="000000" maxlength="6" inputmode="numeric" />
  <button class="submit-btn" id="verifyBtn">Verify</button>
  <button class="link" id="resendBtn">Didn't get a code? Resend</button>
</div>

<script src="/events/js/api.js"></script>
<script src="/events/js/auth.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const phone = params.get("phone") || sessionStorage.getItem("ze_pending_phone") || "";
  const otpInput = document.getElementById("otpInput");
  const verifyBtn = document.getElementById("verifyBtn");
  const resendBtn = document.getElementById("resendBtn");
  const errorBanner = document.getElementById("errorBanner");
  const successBanner = document.getElementById("successBanner");

  if (!phone) location.href = "/events/signup.html";
  document.getElementById("subtitleText").textContent = `Enter the 6-digit code sent to ${phone}`;

  function showError(message) {
    successBanner.classList.remove("show");
    errorBanner.textContent = message;
    errorBanner.classList.add("show");
  }
  function showSuccess(message) {
    errorBanner.classList.remove("show");
    successBanner.textContent = message;
    successBanner.classList.add("show");
  }

  verifyBtn.addEventListener("click", async () => {
    const otp = otpInput.value.trim();
    if (!otp || otp.length < 4) {
      showError("Enter the code from SMS.");
      return;
    }
    verifyBtn.disabled = true;
    verifyBtn.textContent = "Verifying...";
    try {
      const data = await ZE.api("/auth/verify-otp", {
        method: "POST",
        body: JSON.stringify({ phone, otp }),
      });
      ZEAuth.setSession(data.token, data.user);
      sessionStorage.removeItem("ze_pending_phone");
      showSuccess("Phone verified. Welcome!");
      setTimeout(() => { location.replace("/events/"); }, 800);
    } catch (err) {
      showError(err.message || "Verification failed.");
      verifyBtn.disabled = false;
      verifyBtn.textContent = "Verify";
    }
  });

  resendBtn.addEventListener("click", async () => {
    resendBtn.disabled = true;
    try {
      await ZE.api("/auth/resend-otp", {
        method: "POST",
        body: JSON.stringify({ phone }),
      });
      showSuccess("A new code was sent.");
    } catch (err) {
      showError(err.message || "Could not resend code.");
    } finally {
      resendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
