<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shop · Events</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C;
      --cream: #FFF3E8; --peach: #FFD8B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      height: 100%; overflow-y: auto; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 24px;
    }
    button { font: inherit; cursor: pointer; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--orange); padding: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-button {
      width: 40px; height: 40px; padding: 0; background: none; border: none;
      display: flex; align-items: center; justify-content: center; color: var(--cream); font-size: 1.4rem;
    }
    .header-title { color: var(--cream); font-size: 18px; font-weight: 700; }
    .header-sub { color: var(--peach); font-size: 12px; margin-top: 2px; }
    .center-box { padding: 60px 24px; text-align: center; color: var(--subtext); }
    .content { padding: 12px; max-width: 640px; margin: 0 auto; }
    .profile-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .profile-head { display: flex; gap: 14px; align-items: center; }
    .avatar {
      width: 72px; height: 72px; border-radius: 14px; background: #FBEAD9;
      overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; color: var(--orange);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 20px; font-weight: 700; }
    .profile-type { font-size: 12px; color: var(--subtext); margin-top: 2px; }
    .bio { font-size: 14px; line-height: 1.55; color: var(--text); margin-top: 14px; }
    .section-label {
      font-size: 11px; font-weight: 700; color: var(--subtext);
      text-transform: uppercase; margin: 16px 0 8px;
    }
    .photo-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    }
    .photo-grid img {
      width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px;
      background: #FBEAD9; cursor: pointer;
    }
    .empty-text { font-size: 13px; color: var(--subtext); text-align: center; padding: 16px; }
    .review {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; margin-bottom: 8px;
    }
    .review-stars { font-size: 14px; font-weight: 700; color: var(--orange); }
    .review-text { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.45; }
    .review-meta { font-size: 11px; color: var(--subtext); margin-top: 6px; }
    .lightbox {
      position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.9);
      display: grid; place-items: center; padding: 16px;
    }
    .lightbox[hidden] { display: none !important; }
    .lightbox img { max-width: 100%; max-height: 85vh; border-radius: 12px; }
    .lightbox button {
      position: absolute; top: 16px; right: 16px; border: 0; border-radius: 999px;
      padding: 10px 14px; font-weight: 700; background: #fff; cursor: pointer;
    }
  </style>
  <script src="/no-ptr.js"></script>
</head>
<body>
  <div class="topbar">
    <button class="back-button" type="button" onclick="history.back()" aria-label="Go back">‹</button>
    <div>
      <div class="header-title">Shop</div>
      <div class="header-sub">What they do</div>
    </div>
  </div>

  <div id="status" class="center-box">Loading…</div>
  <div class="content" id="content" hidden>
    <div class="profile-card">
      <div class="profile-head">
        <div class="avatar" id="avatar">S</div>
        <div>
          <div class="profile-name" id="name">—</div>
          <div class="profile-type">Shop page</div>
        </div>
      </div>
      <p class="bio" id="bio"></p>
    </div>

    <div class="section-label">What they do · photos</div>
    <div class="photo-grid" id="photoGrid"></div>
    <div id="photoEmpty" class="empty-text" hidden>No gallery yet (needs 4–10 photos).</div>

    <div class="section-label">Reviews</div>
    <div id="reviews"></div>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button type="button" id="closeLb">Close</button>
    <img id="lbImg" alt="" />
  </div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script>
    const vendorId = new URLSearchParams(location.search).get("id");
    const status = document.getElementById("status");
    const content = document.getElementById("content");
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");

    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.getElementById("closeLb").onclick = () => { lightbox.hidden = true; };
    lightbox.onclick = (e) => { if (e.target === lightbox) lightbox.hidden = true; };

    (async () => {
      if (!vendorId) {
        status.textContent = "Missing shop id.";
        return;
      }

      let profile = {};
      let reviews = [];
      let gallery = { photos: [] };

      try {
        [profile, reviews] = await Promise.all([
          ZE.api(`/reviews/vendor/${vendorId}/profile`).catch(() => ({})),
          ZE.api(`/reviews/vendor/${vendorId}`).catch(() => []),
        ]);
      } catch { /* ignore */ }

      try {
        const res = await fetch(`/api/shops/${encodeURIComponent(vendorId)}/gallery`);
        if (res.ok) gallery = await res.json();
      } catch { /* ignore */ }

      status.hidden = true;
      content.hidden = false;

      const name =
        gallery.name ||
        profile.business_name ||
        profile.name ||
        "Shop";
      document.getElementById("name").textContent = name;
      document.getElementById("bio").textContent =
        gallery.bio || profile.business_bio || "No description yet.";

      const avatar = document.getElementById("avatar");
      const cover = (gallery.photos && gallery.photos[0]) || profile.business_photo_url;
      if (cover) {
        avatar.innerHTML = `<img src="${esc(cover)}" alt="" />`;
      } else {
        avatar.textContent = name.charAt(0).toUpperCase();
      }

      const photos = Array.isArray(gallery.photos) ? gallery.photos : [];
      const grid = document.getElementById("photoGrid");
      const empty = document.getElementById("photoEmpty");
      if (photos.length) {
        empty.hidden = true;
        grid.innerHTML = photos.map((url) =>
          `<img src="${esc(url)}" alt="" loading="lazy" data-full="${esc(url)}" />`
        ).join("");
        grid.querySelectorAll("img").forEach((img) => {
          img.onclick = () => {
            lbImg.src = img.dataset.full;
            lightbox.hidden = false;
          };
        });
      } else {
        grid.innerHTML = "";
        empty.hidden = false;
      }

      const box = document.getElementById("reviews");
      if (!reviews.length) {
        box.innerHTML = `<div class="empty-text">No reviews yet.</div>`;
      } else {
        box.innerHTML = reviews.map((r) => `
          <div class="review">
            <div class="review-stars">${"?".repeat(r.rating || 0)}${"?".repeat(5 - (r.rating || 0))}</div>
            <div class="review-text">${esc(r.comment || "No comment.")}</div>
            ${r.reviewer_name ? `<div class="review-meta">${esc(r.reviewer_name)}</div>` : ""}
          </div>`).join("");
      }
    })();
  </script>
</body>
</html>
