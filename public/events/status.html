<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Status · Events</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/events/app-manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C; --cream: #FFF3E8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      height: 100%; overflow-y: auto; overscroll-behavior: none;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 88px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: var(--orange); padding: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-button {
      width: 40px; height: 40px; border: 0; background: none; color: var(--cream);
      font-size: 1.4rem; cursor: pointer;
    }
    .header-title { color: var(--cream); font-size: 18px; font-weight: 700; }
    .header-sub { color: #FFD8B8; font-size: 12px; margin-top: 2px; }
    .wrap { padding: 14px; max-width: 520px; margin: 0 auto; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--subtext); margin-bottom: 6px; }
    textarea {
      width: 100%; min-height: 110px; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; font: inherit; resize: vertical; outline: none;
    }
    .hint { font-size: 12px; color: var(--subtext); margin-top: 8px; line-height: 1.4; }
    .primary {
      width: 100%; margin-top: 12px; border: 0; border-radius: 12px; padding: 14px;
      background: var(--orange); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .ghost {
      width: 100%; margin-top: 8px; border: 1px solid var(--border); border-radius: 12px; padding: 12px;
      background: #fff; color: var(--text); font-weight: 700; cursor: pointer;
    }
    .photo-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
    .photo-row input { flex: 1; font-size: 13px; }
    .preview {
      width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #FBEAD9;
      display: none;
    }
    .colors {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px;
    }
    .color-field {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
      background: #fff;
    }
    .color-field span { font-size: 12px; font-weight: 700; color: var(--subtext); }
    .color-field input[type="color"] {
      width: 36px; height: 36px; border: 0; background: none; padding: 0; cursor: pointer;
    }
    .live-preview {
      margin-top: 12px; border-radius: 14px; min-height: 140px; padding: 16px;
      display: flex; align-items: flex-end; overflow: hidden; position: relative;
      background-size: cover; background-position: center;
    }
    .live-preview .shade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,0.45));
    }
    .live-preview .words {
      position: relative; z-index: 1; font-size: 15px; font-weight: 700;
      line-height: 1.35; word-break: break-word;
    }
    .mine { font-size: 13px; color: var(--subtext); margin-top: 8px; }
    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: #211D1A; color: #fff; padding: 10px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 700; z-index: 50;
    }
    .toast[hidden] { display: none !important; }
  </style>
  <script src="/no-ptr.js"></script>
</head>
<body data-nav-active="status">
  <div class="topbar">
    <button class="back-button" type="button" onclick="location.href='/events/'" aria-label="Back">‹</button>
    <div>
      <div class="header-title">Status</div>
      <div class="header-sub">Visible for 24 hours</div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <label for="statusText">What’s happening?</label>
      <textarea id="statusText" maxlength="280" placeholder="Share an update about your shop or event…"></textarea>
      <div class="photo-row">
        <input type="file" id="photoInput" accept="image/*" />
        <img class="preview" id="preview" alt="" />
      </div>

      <div class="colors">
        <label class="color-field">
          <span>Background</span>
          <input type="color" id="bgColor" value="#C2410C" />
        </label>
        <label class="color-field">
          <span>Words</span>
          <input type="color" id="textColor" value="#FFFFFF" />
        </label>
      </div>
      <div class="live-preview" id="livePreview">
        <div class="shade"></div>
        <div class="words" id="previewWords">Your status text…</div>
      </div>

      <p class="hint">Statuses disappear automatically after 24 hours — like a story.</p>
      <button type="button" class="primary" id="postBtn">Post status</button>
      <button type="button" class="ghost" id="clearBtn" hidden>Remove my status</button>
      <p class="mine" id="mineMeta"></p>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script src="/events/js/status.js"></script>
  <script src="/events/js/bottom-nav.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/events/status.html")) {
      /* redirected */
    } else {
      const user = ZEAuth.getUser();
      const textEl = document.getElementById("statusText");
      const photoInput = document.getElementById("photoInput");
      const preview = document.getElementById("preview");
      const bgColorEl = document.getElementById("bgColor");
      const textColorEl = document.getElementById("textColor");
      const livePreview = document.getElementById("livePreview");
      const previewWords = document.getElementById("previewWords");
      const postBtn = document.getElementById("postBtn");
      const clearBtn = document.getElementById("clearBtn");
      const mineMeta = document.getElementById("mineMeta");
      const toast = document.getElementById("toast");
      let photoUrl = "";
      let myStatus = null;

      const prefs = ZEStatus.getColorPrefs();
      bgColorEl.value = prefs.bgColor;
      textColorEl.value = prefs.textColor;

      function toastMsg(msg) {
        toast.textContent = msg;
        toast.hidden = false;
        clearTimeout(toastMsg._t);
        toastMsg._t = setTimeout(() => { toast.hidden = true; }, 2000);
      }

      function syncPreview() {
        const bg = ZEStatus.safeColor(bgColorEl.value, "#C2410C");
        const words = ZEStatus.safeColor(textColorEl.value, "#FFFFFF");
        livePreview.style.backgroundColor = bg;
        livePreview.style.backgroundImage = photoUrl ? `url('${photoUrl}')` : "none";
        previewWords.style.color = words;
        previewWords.textContent = textEl.value.trim() || "Your status text…";
      }

      textEl.addEventListener("input", syncPreview);
      bgColorEl.addEventListener("input", syncPreview);
      textColorEl.addEventListener("input", syncPreview);

      photoInput.addEventListener("change", async () => {
        const file = photoInput.files && photoInput.files[0];
        if (!file) return;
        try {
          postBtn.disabled = true;
          postBtn.textContent = "Uploading…";
          photoUrl = await ZE.uploadImage(file);
          preview.src = photoUrl;
          preview.style.display = "block";
          syncPreview();
        } catch (err) {
          toastMsg(err.message || "Upload failed");
          photoUrl = "";
        } finally {
          postBtn.disabled = false;
          postBtn.textContent = "Post status";
        }
      });

      async function refreshMine() {
        try {
          const list = await ZEStatus.list();
          myStatus = list.find((s) => String(s.userId) === String(user.id)) || null;
          if (myStatus) {
            clearBtn.hidden = false;
            textEl.value = myStatus.text || "";
            mineMeta.textContent = `Live now · ~${ZEStatus.hoursLeft(myStatus.expiresAt)}h left`;
            if (myStatus.bgColor) bgColorEl.value = ZEStatus.safeColor(myStatus.bgColor, prefs.bgColor);
            if (myStatus.textColor) textColorEl.value = ZEStatus.safeColor(myStatus.textColor, prefs.textColor);
            if (myStatus.photo) {
              preview.src = myStatus.photo;
              preview.style.display = "block";
              photoUrl = myStatus.photo;
            }
          } else {
            clearBtn.hidden = true;
            mineMeta.textContent = "No active status";
          }
          syncPreview();
        } catch {
          mineMeta.textContent = "Could not load statuses";
        }
      }

      postBtn.addEventListener("click", async () => {
        const text = textEl.value.trim();
        if (!text && !photoUrl) {
          toastMsg("Add text or a photo");
          return;
        }
        try {
          postBtn.disabled = true;
          const bgColor = ZEStatus.safeColor(bgColorEl.value, "#C2410C");
          const textColor = ZEStatus.safeColor(textColorEl.value, "#FFFFFF");
          ZEStatus.setColorPrefs({ bgColor, textColor });
          await ZEStatus.create({
            userId: user.id,
            name: user.name || "Guest",
            shop: user.business_name || "",
            text,
            photo: photoUrl,
            bgColor,
            textColor,
          });
          toastMsg("Status posted");
          await refreshMine();
        } catch (err) {
          toastMsg(err.message || "Failed");
        } finally {
          postBtn.disabled = false;
        }
      });

      clearBtn.addEventListener("click", async () => {
        if (!myStatus) return;
        try {
          await ZEStatus.remove(myStatus.id, user.id);
          textEl.value = "";
          photoUrl = "";
          preview.style.display = "none";
          toastMsg("Status removed");
          await refreshMine();
        } catch (err) {
          toastMsg(err.message || "Failed");
        }
      });

      syncPreview();
      refreshMine();
    }
  </script>
</body>
</html>
