<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedEvents - Log In</title>
<meta name="theme-color" content="#C2410C" />
<link rel="manifest" href="/manifest.json" />
<style>
  :root {
    --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
    --text: #211D1A; --subtext: #5C5955; --black: #111111;
    --orange: #C2410C; --cream: #FFF3E8; --price-red: #A3131C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { height: 100%; overflow-y: auto; overscroll-behavior: none; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); overscroll-behavior: none;}
  .content { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 24px; max-width: 480px; margin: 0 auto; }
  .title { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--subtext); margin-bottom: 32px; }
  .label { font-size: 12px; font-weight: 600; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
  .phone-row { display: flex; margin-bottom: 18px; gap: 8px; }
  .phone-prefix { background: var(--orange); border-radius: 10px; padding: 0 12px; display: flex; align-items: center; }
  .phone-prefix span { color: var(--cream); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .phone-input { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; }
  .field-input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; font-size: 14px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; cursor: pointer; }
  .checkbox { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--subtext); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
  .checkbox.checked { background: var(--orange); border-color: var(--orange); }
  .checkbox-label { font-size: 12px; color: var(--subtext); }
  .forgot-link { display: block; text-align: right; color: var(--orange); font-size: 12px; font-weight: 600; margin-bottom: 16px; text-decoration: none; }
  .submit-btn { width: 100%; background: var(--orange); border: none; border-radius: 12px; padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 8px; }
  .submit-btn:disabled { opacity: 0.7; }
  .link { display: block; text-align: center; color: var(--orange); margin-top: 20px; font-size: 13px; text-decoration: none; }
  .form-banner { display: none; border-radius: 10px; padding: 11px 14px; font-size: 13px; font-weight: 600; margin-bottom: 14px; line-height: 1.4; }
  .form-banner.error { background: #FBE7E8; color: var(--price-red); border: 1px solid #F0C1C4; }
  .form-banner.success { background: #E7F5EC; color: #1F7A43; border: 1px solid #BFE5CE; }
  .form-banner.show { display: block; }
</style>
  <script src="/no-ptr.js"></script>
</head>
<body>
<div class="content">
  <div class="title">Welcome Back</div>
  <div class="subtitle">Log in to ZedEvents</div>

  <div class="form-banner error" id="errorBanner"></div>
  <div class="form-banner success" id="successBanner"></div>

  <div class="label">Phone Number</div>
  <div class="phone-row">
    <div class="phone-prefix"><span>???? +260</span></div>
    <input class="phone-input" id="phone" placeholder="Phone number" maxlength="10" inputmode="tel" />
  </div>

  <div class="label">Password</div>
  <input class="field-input" id="password" type="password" placeholder="Enter your password" />

  <div class="checkbox-row" id="showPasswordRow">
    <div class="checkbox" id="checkboxBox"></div>
    <div class="checkbox-label">Show password</div>
  </div>

  <a class="forgot-link" href="/events/forgot-password.html">Forgot Password?</a>

  <button class="submit-btn" id="loginBtn" type="button">Log In</button>
  <a class="link" href="/events/signup.html">Don't have an account? Sign up</a>
</div>

<script src="/events/js/api.js"></script>
<script src="/events/js/auth.js"></script>
<script src="/events/js/phone.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "/";
  const phoneInput = document.getElementById("phone");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const errorBanner = document.getElementById("errorBanner");
  const successBanner = document.getElementById("successBanner");
  const checkboxBox = document.getElementById("checkboxBox");

  function showError(message) {
    successBanner.classList.remove("show");
    errorBanner.textContent = message;
    errorBanner.classList.add("show");
  }
  function showSuccess(message) {
    errorBanner.classList.remove("show");
    successBanner.textContent = message;
    successBanner.classList.add("show");
  }
  function clearBanners() {
    errorBanner.classList.remove("show");
    successBanner.classList.remove("show");
  }

  let showPassword = false;
  document.getElementById("showPasswordRow").addEventListener("click", () => {
    showPassword = !showPassword;
    checkboxBox.classList.toggle("checked", showPassword);
    checkboxBox.textContent = showPassword ? "?" : "";
    passwordInput.type = showPassword ? "text" : "password";
  });

  loginBtn.addEventListener("click", async () => {
    clearBanners();
    const phone = normalizeZambianPhone(phoneInput.value);
    const password = passwordInput.value;
    if (!phone || !password) {
      showError("Please enter your phone and password.");
      return;
    }
    if (!isValidZambianPhone(phone)) {
      showError("Airtel and Zamtel only.");
      return;
    }
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in…";
    try {
      const data = await ZE.api("/auth/login", {
        method: "POST",
        body: JSON.stringify({ phone, password }),
      });
      ZEAuth.setSession(data.token, data.user);
      showSuccess(`Welcome back! Logged in as ${data.user.name}`);
      setTimeout(() => { location.replace(next); }, 700);
    } catch (err) {
      showError(err.message || "Something went wrong.");
      loginBtn.disabled = false;
      loginBtn.textContent = "Log In";
    }
  });
</script>
</body>
</html>
