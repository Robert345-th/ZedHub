<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shop photos · Events</title>
  <meta name="theme-color" content="#C2410C" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C; --cream: #FFF3E8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body {
      height: 100%; overflow-y: auto; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 88px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 40; background: var(--orange); padding: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-button {
      width: 40px; height: 40px; border: 0; background: none; color: var(--cream);
      font-size: 1.4rem; cursor: pointer;
    }
    .header-title { color: var(--cream); font-size: 18px; font-weight: 700; }
    .header-sub { color: #FFD8B8; font-size: 12px; margin-top: 2px; }
    .wrap { padding: 14px; max-width: 560px; margin: 0 auto; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    .label { font-size: 12px; font-weight: 700; color: var(--subtext); margin-bottom: 6px; text-transform: uppercase; }
    textarea, input[type="text"] {
      width: 100%; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; font: inherit; margin-bottom: 12px; outline: none;
    }
    textarea { min-height: 90px; resize: vertical; }
    .hint { font-size: 13px; color: var(--subtext); line-height: 1.4; margin-bottom: 12px; }
    .count { font-size: 13px; font-weight: 700; color: var(--orange); margin-bottom: 10px; }
    .count.bad { color: #B42318; }
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px;
    }
    .tile {
      position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden;
      background: #FBEAD9;
    }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile button {
      position: absolute; top: 4px; right: 4px; width: 28px; height: 28px;
      border: 0; border-radius: 50%; background: rgba(0,0,0,0.65); color: #fff;
      font-weight: 700; cursor: pointer;
    }
    .add {
      border: 1.5px dashed var(--border); border-radius: 12px; aspect-ratio: 1;
      display: grid; place-items: center; background: #fff; cursor: pointer;
      color: var(--subtext); font-weight: 700; font-size: 28px;
    }
    .primary {
      width: 100%; border: 0; border-radius: 12px; padding: 14px;
      background: var(--orange); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .primary:disabled { opacity: 0.55; }
    .toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: #211D1A; color: #fff; padding: 10px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 700; z-index: 50;
    }
    .toast[hidden] { display: none !important; }
  </style>
  <script src="/no-ptr.js"></script>
</head>
<body data-nav-active="shop">
  <div class="topbar">
    <button class="back-button" type="button" onclick="location.href='/events/my-shop.html'" aria-label="Back">‹</button>
    <div>
      <div class="header-title">What you do</div>
      <div class="header-sub">4 to 10 photos required</div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <p class="hint">Show your work with <strong>at least 4 photos</strong> (max 10). Visitors see these on your shop page.</p>
      <div class="label">Shop name</div>
      <input type="text" id="shopName" maxlength="80" placeholder="Your shop name" />
      <div class="label">About</div>
      <textarea id="shopBio" maxlength="500" placeholder="What do you do for events?"></textarea>
      <div class="count" id="count">0 / 10 photos · need 4</div>
      <div class="grid" id="grid"></div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
      <button type="button" class="primary" id="saveBtn" disabled>Save gallery</button>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script src="/events/js/bottom-nav.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/events/shop-photos.html")) {
      /* redirected */
    } else {
      const MIN = 4;
      const MAX = 10;
      const user = ZEAuth.getUser();
      const grid = document.getElementById("grid");
      const countEl = document.getElementById("count");
      const saveBtn = document.getElementById("saveBtn");
      const fileInput = document.getElementById("fileInput");
      const toast = document.getElementById("toast");
      let photos = [];

      function toastMsg(msg) {
        toast.textContent = msg;
        toast.hidden = false;
        clearTimeout(toastMsg._t);
        toastMsg._t = setTimeout(() => { toast.hidden = true; }, 2200);
      }

      function paint() {
        const n = photos.length;
        countEl.textContent = `${n} / ${MAX} photos · ${n < MIN ? `need ${MIN}` : "ready"}`;
        countEl.classList.toggle("bad", n < MIN);
        saveBtn.disabled = n < MIN || n > MAX;
        grid.innerHTML = "";
        photos.forEach((url, i) => {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.innerHTML = `<img src="${url}" alt="" /><button type="button" data-i="${i}" aria-label="Remove">×</button>`;
          grid.appendChild(tile);
        });
        if (photos.length < MAX) {
          const add = document.createElement("button");
          add.type = "button";
          add.className = "add";
          add.textContent = "+";
          add.onclick = () => fileInput.click();
          grid.appendChild(add);
        }
        grid.querySelectorAll("[data-i]").forEach((btn) => {
          btn.onclick = () => {
            photos.splice(Number(btn.dataset.i), 1);
            paint();
          };
        });
      }

      fileInput.addEventListener("change", async () => {
        const files = Array.from(fileInput.files || []);
        fileInput.value = "";
        const room = MAX - photos.length;
        if (room <= 0) {
          toastMsg(`Max ${MAX} photos`);
          return;
        }
        const batch = files.slice(0, room);
        for (const file of batch) {
          try {
            saveBtn.disabled = true;
            saveBtn.textContent = "Uploading…";
            const url = await ZE.uploadImage(file);
            photos.push(url);
            paint();
          } catch (err) {
            toastMsg(err.message || "Upload failed");
          }
        }
        saveBtn.textContent = "Save gallery";
        paint();
      });

      saveBtn.addEventListener("click", async () => {
        if (photos.length < MIN || photos.length > MAX) {
          toastMsg(`Use ${MIN}–${MAX} photos`);
          return;
        }
        try {
          saveBtn.disabled = true;
          saveBtn.textContent = "Saving…";
          const res = await fetch(`/api/shops/${encodeURIComponent(user.id)}/gallery`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId: user.id,
              name: document.getElementById("shopName").value.trim() || user.business_name || user.name || "",
              bio: document.getElementById("shopBio").value.trim(),
              photos,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Save failed");
          toastMsg("Gallery saved");
          setTimeout(() => { location.href = "/events/my-shop.html"; }, 700);
        } catch (err) {
          toastMsg(err.message || "Save failed");
          saveBtn.disabled = false;
          saveBtn.textContent = "Save gallery";
        }
      });

      (async () => {
        document.getElementById("shopName").value = user.business_name || user.name || "";
        try {
          const res = await fetch(`/api/shops/${encodeURIComponent(user.id)}/gallery`);
          if (res.ok) {
            const data = await res.json();
            photos = Array.isArray(data.photos) ? data.photos.slice(0, MAX) : [];
            if (data.name) document.getElementById("shopName").value = data.name;
            if (data.bio) document.getElementById("shopBio").value = data.bio;
          }
        } catch { /* ignore */ }
        paint();
      })();
    }
  </script>
</body>
</html>
