<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents - Post a service</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C;
      --cream: #FFF3E8; --peach: #FFD8B8; --price-red: #A3131C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 32px;
    }
    button, input, select, textarea { font: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--orange); padding: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-button {
      width: 40px; height: 40px; padding: 0; background: none; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .back-button svg {
      width: 22px; height: 22px; stroke: var(--cream); fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-title { color: var(--cream); font-size: 18px; font-weight: 700; }
    .header-sub { color: var(--peach); font-size: 12px; margin-top: 2px; }
    .content { padding: 16px; max-width: 560px; margin: 0 auto; }
    .form-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px;
    }
    .form-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .form-sub { font-size: 13px; color: var(--subtext); margin-bottom: 18px; line-height: 1.45; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700; color: var(--subtext);
      text-transform: uppercase; margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px; font-size: 14px; color: var(--text);
    }
    .field textarea { min-height: 100px; resize: vertical; }
    .loc-btn {
      width: 100%; background: var(--cream); border: 1px solid #F0D2A8;
      border-radius: 10px; padding: 12px; color: var(--orange);
      font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 8px;
    }
    .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .photo-thumb {
      width: 72px; height: 72px; border-radius: 10px; object-fit: cover;
      background: #FBEAD9;
    }
    .hint {
      font-size: 12px; color: var(--subtext); margin: 0 0 14px; line-height: 1.45;
      background: var(--cream); border-radius: 10px; padding: 10px 12px;
    }
    .error {
      display: none; background: #FBE7E8; color: var(--price-red);
      border: 1px solid #F0C1C4; border-radius: 10px;
      padding: 11px 14px; font-size: 13px; font-weight: 600; margin-bottom: 14px;
    }
    .error.show { display: block; }
    .submit-btn {
      width: 100%; background: var(--orange); border: none; border-radius: 12px;
      padding: 15px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.7; cursor: default; }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back-button" type="button" onclick="history.back()" aria-label="Go back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div>
      <div class="header-title">Post a service</div>
      <div class="header-sub">List your event offering</div>
    </div>
  </div>

  <div class="content">
    <form class="form-card" id="form">
      <div class="form-title">New service</div>
      <div class="form-sub">Catering, DJ, décor, tents, photography, and more.</div>
      <div class="error" id="error"></div>

      <div class="field">
        <label>Photos (up to 5)</label>
        <input id="photos" type="file" accept="image/*" multiple />
        <div class="photo-grid" id="preview"></div>
      </div>

      <div class="field">
        <label for="category">Category</label>
        <select id="category" required></select>
      </div>

      <div class="field">
        <label for="title">Title</label>
        <input id="title" required maxlength="120" placeholder="e.g. Wedding cakes in Lusaka" />
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" placeholder="What's included, packages, areas you cover…"></textarea>
      </div>

      <div class="field">
        <label for="price">Price (K) — optional</label>
        <input id="price" type="number" min="0" step="1" placeholder="Leave blank to ask for quote" />
      </div>

      <div class="field">
        <label>Service location</label>
        <button type="button" class="loc-btn" id="locBtn">Use my current location</button>
        <input id="locationLabel" placeholder="Area covered (e.g. Lusaka, Kabulonga)" />
        <input type="hidden" id="latitude" />
        <input type="hidden" id="longitude" />
      </div>

      <div class="hint">Posts stay private until an admin approves them. They won't show on Home until then.</div>
      <button class="submit-btn" type="submit" id="submitBtn">Submit for approval</button>
    </form>
  </div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script src="/events/js/location.js"></script>
  <script src="/events/js/ui.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/post-service.html")) {
      /* redirected */
    } else {
      const error = document.getElementById("error");
      const preview = document.getElementById("preview");
      const categoryEl = document.getElementById("category");
      let selectedFiles = [];

      function showError(msg) {
        error.textContent = msg;
        error.classList.add("show");
      }

      (async () => {
        try {
          const profile = await ZE.api("/auth/vendor-profile");
          if (!profile.is_vendor) {
            location.href = "/events/register-shop.html?next=/post-service.html";
            return;
          }
        } catch { /* post will fail if not vendor */ }

        try {
          const cats = await ZE.api("/services/categories");
          categoryEl.innerHTML = cats
            .map((c) => `<option value="${c.id}">${c.name}</option>`)
            .join("");
        } catch {
          showError("Could not load categories.");
        }
      })();

      document.getElementById("photos").addEventListener("change", (e) => {
        selectedFiles = Array.from(e.target.files || []).slice(0, 5);
        preview.innerHTML = selectedFiles
          .map((f) => `<img class="photo-thumb" src="${URL.createObjectURL(f)}" alt="" />`)
          .join("");
      });

      document.getElementById("locBtn").addEventListener("click", () => {
        const btn = document.getElementById("locBtn");
        btn.disabled = true;
        btn.textContent = "Getting location…";
        ZELocation.getDeviceCoords()
          .then((coords) => {
            document.getElementById("latitude").value = coords.lat;
            document.getElementById("longitude").value = coords.lng;
            ZELocation.saveCoords(coords);
            if (!document.getElementById("locationLabel").value.trim()) {
              document.getElementById("locationLabel").value = `${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}`;
            }
            btn.textContent = "Location saved";
          })
          .catch(() => {
            showError("Could not get location. Type your area instead.");
            btn.textContent = "Use my current location";
          })
          .finally(() => { btn.disabled = false; });
      });

      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        error.classList.remove("show");
        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "Submitting…";
        try {
          const photoUrls = [];
          for (const file of selectedFiles) {
            photoUrls.push(await ZE.uploadImage(file));
          }
          const priceVal = document.getElementById("price").value;
          const latVal = document.getElementById("latitude").value;
          const lngVal = document.getElementById("longitude").value;
          await ZE.api("/services", {
            method: "POST",
            body: JSON.stringify({
              title: document.getElementById("title").value.trim(),
              description: document.getElementById("description").value.trim(),
              price: priceVal ? Number(priceVal) : null,
              category_id: Number(categoryEl.value) || null,
              photos: photoUrls,
              latitude: latVal ? Number(latVal) : null,
              longitude: lngVal ? Number(lngVal) : null,
              location_label: document.getElementById("locationLabel").value.trim() || null,
            }),
          });
          location.href = "/events/my-shop.html?posted=1";
        } catch (err) {
          if (err.data && err.data.needsVendorProfile) {
            location.href = "/events/register-shop.html?next=/post-service.html";
            return;
          }
          showError(err.message || "Could not post service.");
          btn.disabled = false;
          btn.textContent = "Submit for approval";
        }
      });
    }
  </script>
</body>
</html>
