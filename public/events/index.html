<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents</title>
  <meta name="theme-color" content="#C2410C" />
  <meta name="description" content="Find event services in Zambia ? catering, DJs, tents, d?cor and more." />
  <link rel="manifest" href="/events/app-manifest.json" />
  <link rel="apple-touch-icon" href="/icons/zedevents.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Events" />
  <style>
    :root {
      --bg: #F4F1EC;
      --card: #FFFFFF;
      --border: #E2E0DC;
      --text: #211D1A;
      --subtext: #5C5955;
      --orange: #C2410C;
      --orange-hot: #EA580C;
      --cream: #FFF3E8;
      --peach: #FFD8B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { height: 100%; overflow-y: auto; overscroll-behavior: none; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 72px; overscroll-behavior: none;}
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .sticky-header { position: sticky; top: 0; z-index: 100; background: var(--bg); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .topbar {
      background: var(--orange);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .gear {
      background: none; border: none; color: var(--cream);
      cursor: pointer; text-align: center; flex-shrink: 0;
    }
    .gear .icon { font-size: 22px; line-height: 1; }
    .gear .label { font-size: 9px; color: var(--peach); margin-top: 2px; }
    .brand { color: var(--cream); font-size: 20px; font-weight: 700; }
    .brand-sub { color: var(--peach); font-size: 12px; margin-top: 2px; }
    .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
    .auth-btn {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 34px; padding: 0 12px; border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.12);
      color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .icon-row { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 18px;
      background: rgba(255,255,255,0.18); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; color: #fff;
    }
    .icon-btn svg {
      width: 18px; height: 18px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .thumb-ph {
      width: 42px; height: 42px; border-radius: 10px; border: 1.5px dashed #E2B48A;
      color: #C2410C; opacity: 0.55;
    }
    .thumb-ph svg {
      width: 100%; height: 100%; stroke: currentColor; fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      padding: 8px;
    }
    .badge {
      position: absolute; top: -4px; right: -4px;
      background: #DC2626; border-radius: 8px; min-width: 16px; height: 16px;
      color: #fff; font-size: 9px; font-weight: 700;
      display: none; align-items: center; justify-content: center; padding: 0 3px;
    }

    .search-row { padding: 12px; }
    .search-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; font-size: 14px; color: var(--text);
      outline: none;
    }
    .chips-row {
      display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 10px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .sort-row {
      display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 12px;
      scrollbar-width: none;
    }
    .sort-row::-webkit-scrollbar { display: none; }
    .sort-chip {
      flex: 0 0 auto; border: 1px solid var(--border); background: var(--card);
      border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 600;
      color: var(--subtext); cursor: pointer;
    }
    .sort-chip.active { background: var(--cream); border-color: var(--orange); color: var(--orange); }
    .remind-banner {
      margin: 0 12px 10px; padding: 12px 14px; border-radius: 14px;
      background: #FFF3E8; border: 1px solid #FFD8B8; color: var(--text);
      font-size: 13px; line-height: 1.4;
    }
    .remind-banner[hidden] { display: none !important; }
    .remind-banner strong { display: block; margin-bottom: 4px; color: var(--orange); }
    .remind-banner a { color: var(--orange); font-weight: 700; }
    .status-strip {
      display: flex; gap: 10px; overflow-x: auto; padding: 8px 12px 16px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .status-strip::-webkit-scrollbar { display: none; }
    .status-strip[hidden] { display: none !important; }
    .story-card {
      flex: 0 0 auto; width: 118px; height: 210px; border: 0; padding: 0;
      border-radius: 14px; overflow: hidden; position: relative;
      cursor: pointer; background: #3a2a20; font: inherit; color: #fff;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }
    .story-card .bg {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      background-color: #5c4033;
    }
    .story-card .shade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, transparent 35%, rgba(0,0,0,0.75) 100%);
    }
    .story-card .badge {
      position: absolute; top: 8px; left: 8px; min-width: 22px; height: 22px;
      padding: 0 6px; border-radius: 6px; background: #1877F2; color: #fff;
      font-size: 11px; font-weight: 800; display: grid; place-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .story-card .story-name {
      position: absolute; left: 8px; right: 8px; bottom: 10px;
      font-size: 12px; font-weight: 800; text-align: left; line-height: 1.2;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .story-card .initial {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 42px; font-weight: 800; color: rgba(255,255,255,0.85);
    }
    .status-viewer {
      position: fixed; inset: 0; z-index: 200; background: rgba(10,8,6,0.94);
      display: grid; place-items: center; padding: 16px;
    }
    .status-viewer[hidden] { display: none !important; }
    .status-sheet {
      width: min(360px, 100%); aspect-ratio: 9/16; max-height: 85vh;
      background: #1a1410; color: #fff; border-radius: 18px;
      padding: 0; overflow: hidden; position: relative;
      display: flex; flex-direction: column;
    }
    .status-sheet .full-bg {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      background-color: #3a2a20;
    }
    .status-sheet .full-shade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.35), transparent 30%, rgba(0,0,0,0.85));
    }
    .status-sheet .body {
      position: relative; z-index: 1; margin-top: auto; padding: 18px 16px 16px;
    }
    .status-sheet h3 { font-size: 17px; margin-bottom: 4px; }
    .status-sheet .meta { font-size: 12px; opacity: 0.75; margin-bottom: 10px; }
    .status-sheet p { font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
    .status-sheet .actions {
      position: relative; z-index: 1; display: grid; gap: 8px; padding: 0 16px 16px;
    }
    .status-sheet .actions a,
    .status-sheet .actions button {
      border: 0; border-radius: 12px; padding: 12px; font-weight: 700;
      text-align: center; text-decoration: none; cursor: pointer; font: inherit;
    }
    .status-sheet .actions a { background: rgba(255,255,255,0.15); color: #fff; }
    .status-sheet .actions button { background: #C2410C; color: #fff; }
    .chip {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 7px 14px; font-size: 13px; white-space: nowrap; cursor: pointer; flex-shrink: 0;
      color: var(--text);
    }
    .chip.active {
      background: var(--orange-hot); border-color: var(--orange-hot);
      color: #fff; font-weight: 600;
    }

    .grid {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 4px 12px 24px;
    }
    .card {
      width: calc(50% - 5px);
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; cursor: pointer;
    }
    .thumb {
      height: 150px; background: #FBEAD9;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 10px; }
    .card-cat {
      font-size: 10px; font-weight: 700; color: var(--orange);
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .title {
      font-size: 13px; font-weight: 600; color: var(--text);
      margin: 4px 0; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .price { font-size: 13px; font-weight: 700; color: var(--orange); }
    .vendor { font-size: 11px; color: var(--subtext); margin-top: 3px; }
    .distance { font-size: 10px; color: var(--orange-hot); font-weight: 600; margin-top: 2px; }
    .status { text-align: center; padding: 60px 20px; color: var(--subtext); }
  </style>
  <script src="/no-ptr.js"></script>
</head>
<body data-nav-active="home">
  <div class="sticky-header">
    <div class="topbar">
      <div class="topbar-left">
        <button class="gear" type="button" id="menuBtn" aria-label="Menu">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </div>
          <div class="label">Menu</div>
        </button>
        <div>
          <div class="brand">ZedEvents</div>
          <div class="brand-sub" id="greet">Shops &amp; 24h statuses</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="auth-btn" type="button" id="authBtn">Login / Sign Up</button>
        <div class="icon-row">
          <button class="icon-btn" type="button" id="mapBtn" aria-label="Map">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5v17l-5 2V5.5z"/><path d="M9 3.5 15 5.5v17l-6-2z"/><path d="M15 5.5 20 3.5v17l-5 2z"/></svg>
          </button>
          <button class="icon-btn" type="button" id="favBtn" aria-label="Favorites">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
          <button class="icon-btn" type="button" id="chatBtn" aria-label="Chats">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="badge" id="chatBadge"></span>
          </button>
        </div>
      </div>
    </div>

    <div class="search-row">
      <input class="search-input" id="search" type="search" placeholder="Search catering, DJs, tents..." />
    </div>
    <div class="chips-row" id="cats">
      <button type="button" class="chip active" data-id="">All</button>
      <button type="button" class="chip" data-id="__nearby__">Nearby</button>
    </div>
    <div class="sort-row" id="sortRow" aria-label="Sort">
      <button type="button" class="sort-chip active" data-sort="featured">Featured</button>
      <button type="button" class="sort-chip" data-sort="newest">Newest</button>
      <button type="button" class="sort-chip" data-sort="price-asc">Price ?</button>
      <button type="button" class="sort-chip" data-sort="price-desc">Price ?</button>
      <button type="button" class="sort-chip" data-sort="az">A?Z</button>
    </div>
  </div>

  <div class="remind-banner" id="remindBanner" hidden></div>
  <div class="status-strip" id="statusStrip" hidden></div>
  <div id="status" class="status">Loading?</div>
  <div class="grid" id="grid" hidden></div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script src="/events/js/location.js"></script>
  <script src="/events/js/reminders.js"></script>
  <script src="/events/js/status.js"></script>
  <script src="/events/js/bottom-nav.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const catsEl = document.getElementById("cats");
    const search = document.getElementById("search");
    const sortRow = document.getElementById("sortRow");
    let services = [];
    let activeCategory = "";
    let sortNearby = false;
    let sortMode = "featured";
    let myCoords = ZELocation.getSavedCoords();

    function goLogin(next) {
      const path = ZEAuth.eventsPath(next);
      if (!ZEAuth.requireLogin(path)) return false;
      location.href = path;
      return true;
    }

    document.getElementById("menuBtn").onclick = () => goLogin("/events/settings.html");
    document.getElementById("favBtn").onclick = () => goLogin("/events/favorites.html");
    document.getElementById("chatBtn").onclick = () => goLogin("/events/chats.html");
    document.getElementById("mapBtn").onclick = () => { location.href = "/events/map-view.html"; };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function paintAuth() {
      const user = ZEAuth.getUser();
      const greet = document.getElementById("greet");
      const authBtn = document.getElementById("authBtn");
      if (user) {
        greet.textContent = `Hi, ${user.name || "there"}`;
        authBtn.textContent = user.name || "Account";
        authBtn.onclick = () => { location.href = "/events/settings.html"; };
        loadUnread();
      } else {
        authBtn.onclick = () => { location.href = "/events/login.html"; };
      }
    }

    async function loadUnread() {
      try {
        const data = await ZE.api("/messages/unread-count");
        const badge = document.getElementById("chatBadge");
        const n = data.count || 0;
        if (n > 0) {
          badge.style.display = "flex";
          badge.textContent = n > 9 ? "9+" : String(n);
        }
      } catch { /* ignore */ }
    }

    async function loadStatuses() {
      const strip = document.getElementById("statusStrip");
      if (!strip || !window.ZEStatus) return;
      try {
        const list = await ZEStatus.list();
        if (!list.length) {
          strip.hidden = true;
          return;
        }
        strip.hidden = false;
        strip.innerHTML = list.map((s) => {
          const label = escapeHtml(s.shop || s.name || "Status");
          const hours = ZEStatus.hoursLeft(s.expiresAt);
          const bgColor = ZEStatus.safeColor(s.bgColor, "#5c4033");
          const textColor = ZEStatus.safeColor(s.textColor, "#ffffff");
          const bgParts = [`background-color:${bgColor}`];
          if (s.photo) bgParts.push(`background-image:url('${escapeHtml(s.photo)}')`);
          const initial = escapeHtml((s.name || "S").trim().charAt(0).toUpperCase());
          return `
            <button type="button" class="story-card" data-id="${escapeHtml(s.id)}">
              <div class="bg" style="${bgParts.join(";")}"></div>
              ${s.photo ? "" : `<div class="initial" style="color:${textColor}">${initial}</div>`}
              <div class="shade"></div>
              <span class="badge">${hours}</span>
              <span class="story-name" style="color:${textColor}">${label}</span>
            </button>`;
        }).join("");
        strip.querySelectorAll(".story-card").forEach((btn) => {
          btn.addEventListener("click", () => {
            const item = list.find((x) => x.id === btn.dataset.id);
            if (item) openStatus(item);
          });
        });
      } catch {
        strip.hidden = true;
      }
    }

    function openStatus(item) {
      let viewer = document.getElementById("statusViewer");
      if (!viewer) {
        viewer = document.createElement("div");
        viewer.id = "statusViewer";
        viewer.className = "status-viewer";
        document.body.appendChild(viewer);
      }
      const hours = ZEStatus.hoursLeft(item.expiresAt);
      const bgColor = ZEStatus.safeColor(item.bgColor, "#3a2a20");
      const textColor = ZEStatus.safeColor(item.textColor, "#ffffff");
      const bgParts = [`background-color:${bgColor}`];
      if (item.photo) bgParts.push(`background-image:url('${escapeHtml(item.photo)}')`);
      viewer.hidden = false;
      viewer.innerHTML = `
        <div class="status-sheet" style="background:${bgColor};color:${textColor}">
          <div class="full-bg" style="${bgParts.join(";")}"></div>
          <div class="full-shade"></div>
          <div class="body" style="color:${textColor}">
            <h3>${escapeHtml(item.shop || item.name || "Status")}</h3>
            <div class="meta">${escapeHtml(item.name || "")} · ${hours}h left</div>
            ${item.text ? `<p>${escapeHtml(item.text)}</p>` : ""}
          </div>
          <div class="actions">
            ${item.userId ? `<a href="/events/vendor.html?id=${encodeURIComponent(item.userId)}">View shop</a>` : ""}
            <button type="button" id="closeStatus">Close</button>
          </div>
        </div>`;
      viewer.querySelector("#closeStatus").onclick = () => { viewer.hidden = true; };
      viewer.onclick = (e) => { if (e.target === viewer) viewer.hidden = true; };
    }

    function formatDistance(km) {
      if (km == null) return "";
      if (km < 1) return `${Math.round(km * 1000)} m away`;
      return `${km.toFixed(km < 10 ? 1 : 0)} km away`;
    }

    function withDistance(list) {
      if (!myCoords) return list.map((item) => ({ ...item, distanceKm: null }));
      return list.map((item) => {
        const lat = parseFloat(item.latitude);
        const lng = parseFloat(item.longitude);
        const distanceKm = Number.isFinite(lat) && Number.isFinite(lng)
          ? ZELocation.getDistanceKm(myCoords.lat, myCoords.lng, lat, lng)
          : null;
        return { ...item, distanceKm };
      });
    }

    function renderCards(list) {
      let rows = withDistance(list);
      if (sortNearby && myCoords) {
        rows = rows.slice().sort((a, b) => {
          if (a.distanceKm == null && b.distanceKm == null) return 0;
          if (a.distanceKm == null) return 1;
          if (b.distanceKm == null) return -1;
          return a.distanceKm - b.distanceKm;
        });
      }

      if (!rows.length) {
        grid.hidden = true;
        status.hidden = false;
        status.textContent = search.value.trim()
          ? "No services match your search."
          : sortNearby && !myCoords
            ? "Turn on location to see nearby services."
            : "No services posted yet.";
        return;
      }
      status.hidden = true;
      grid.hidden = false;
      grid.innerHTML = rows.map((item) => {
        const photo = ZE.thumbUrl(ZE.firstPhoto(item.photos), 400);
        const vendor = item.business_name || item.vendor_name || "Vendor";
        const dist = formatDistance(item.distanceKm);
        const img = photo
          ? `<img src="${photo}" alt="" loading="lazy" decoding="async" />`
          : `<div class="thumb-ph" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 16-5-5-4 4-2-2-5 5"/></svg></div>`;
        return `
          <a class="card" href="/events/service.html?id=${item.id}">
            <div class="thumb">${img}</div>
            <div class="card-info">
              <div class="card-cat">${escapeHtml(item.category || "Service")}</div>
              <div class="title">${escapeHtml(item.title || "Untitled")}</div>
              <div class="price">${ZE.formatPrice(item.price)}</div>
              ${dist ? `<div class="distance">${escapeHtml(dist)}</div>` : ""}
              <div class="vendor">${escapeHtml(vendor)}</div>
            </div>
          </a>`;
      }).join("");
    }

    function applyFilter() {
      const q = search.value.trim().toLowerCase();
      let filtered = services.filter((item) => {
        if (!q) return true;
        const blob = `${item.title || ""} ${item.description || ""} ${item.business_name || ""} ${item.vendor_name || ""} ${item.category || ""}`.toLowerCase();
        return blob.includes(q);
      });
      if (sortNearby && myCoords) {
        filtered = filtered.filter((item) => {
          const lat = parseFloat(item.latitude);
          const lng = parseFloat(item.longitude);
          return Number.isFinite(lat) && Number.isFinite(lng);
        });
      }
      filtered = sortList(filtered);
      renderCards(filtered);
    }

    function sortList(rows) {
      const list = rows.slice();
      if (sortMode === "az") {
        list.sort((a, b) => String(a.title || "").localeCompare(String(b.title || "")));
      } else if (sortMode === "price-asc") {
        list.sort((a, b) => (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0));
      } else if (sortMode === "price-desc") {
        list.sort((a, b) => (parseFloat(b.price) || 0) - (parseFloat(a.price) || 0));
      } else if (sortMode === "newest") {
        list.sort((a, b) => {
          const ta = new Date(a.created_at || a.updated_at || 0).getTime();
          const tb = new Date(b.created_at || b.updated_at || 0).getTime();
          return tb - ta;
        });
      } else if (sortNearby && myCoords) {
        // featured nearby = closest first (distance already attached in render path)
        list.sort((a, b) => (a.distanceKm || 1e9) - (b.distanceKm || 1e9));
      } else {
        // featured: items with photos first, then price presence
        list.sort((a, b) => {
          const pa = ZE.firstPhoto(a.photos) ? 0 : 1;
          const pb = ZE.firstPhoto(b.photos) ? 0 : 1;
          if (pa !== pb) return pa - pb;
          return String(a.title || "").localeCompare(String(b.title || ""));
        });
      }
      return list;
    }

    function showReminders() {
      const banner = document.getElementById("remindBanner");
      if (!banner || !window.ZEReminders) return;
      const due = ZEReminders.due();
      const soon = ZEReminders.upcoming(24);
      if (!due.length && !soon.length) {
        banner.hidden = true;
        return;
      }
      const item = due[0] || soon[0];
      const label = due.length
        ? `Reminder due: ${item.title}`
        : `Upcoming reminder: ${item.title}`;
      banner.hidden = false;
      banner.innerHTML = `<strong>${label}</strong><a href="/events/service.html?id=${encodeURIComponent(item.id)}">Open service</a>`;
      if (due.length) {
        // auto-clear due after showing once this session
        due.forEach((r) => ZEReminders.remove(r.id));
      }
    }

    async function loadCategories() {
      try {
        let cats;
        try {
          const cached = sessionStorage.getItem("ze_categories");
          if (cached) cats = JSON.parse(cached);
        } catch { /* ignore */ }
        if (!Array.isArray(cats) || !cats.length) {
          cats = await ZE.api("/services/categories");
          try { sessionStorage.setItem("ze_categories", JSON.stringify(cats)); } catch { /* ignore */ }
        }
        cats.forEach((c) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip";
          btn.dataset.id = c.id;
          btn.textContent = c.name;
          catsEl.appendChild(btn);
        });
      } catch { /* ignore */ }
    }

    let allServicesCache = null;

    async function loadServices(force) {
      status.hidden = false;
        status.textContent = "Loading?";
      grid.hidden = true;
      try {
        if (activeCategory && activeCategory !== "__nearby__") {
          services = await ZE.api(`/services?category_id=${encodeURIComponent(activeCategory)}`);
        } else if (!force && Array.isArray(allServicesCache)) {
          services = allServicesCache;
        } else {
          services = await ZE.api("/services");
          allServicesCache = services;
        }
        applyFilter();
      } catch {
        status.hidden = false;
        grid.hidden = true;
        status.textContent = "Could not load services.";
      }
    }

    catsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      catsEl.querySelectorAll(".chip").forEach((el) => el.classList.remove("active"));
      btn.classList.add("active");
      const id = btn.dataset.id || "";
      sortNearby = id === "__nearby__";
      activeCategory = sortNearby ? "" : id;
      if (sortNearby) {
        const finishNearby = () => {
          if (allServicesCache) {
            services = allServicesCache;
            applyFilter();
          } else {
            loadServices(true);
          }
        };
        if (!myCoords) {
          ZELocation.getDeviceCoords()
            .then((coords) => {
              myCoords = coords;
              ZELocation.saveCoords(coords);
              finishNearby();
            })
            .catch(() => finishNearby());
          return;
        }
        finishNearby();
        return;
      }
      loadServices(false);
    });

    search.addEventListener("input", applyFilter);
    sortRow.addEventListener("click", (e) => {
      const btn = e.target.closest(".sort-chip");
      if (!btn) return;
      sortRow.querySelectorAll(".sort-chip").forEach((el) => el.classList.remove("active"));
      btn.classList.add("active");
      sortMode = btn.dataset.sort || "featured";
      applyFilter();
    });
    paintAuth();
    showReminders();
    loadStatuses();
    loadCategories();
    loadServices(true);
  </script>
</body>
</html>
