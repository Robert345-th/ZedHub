<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents</title>
  <meta name="theme-color" content="#C2410C" />
  <meta name="description" content="Find event services in Zambia — catering, DJs, tents, décor and more." />
  <link rel="manifest" href="/events/app-manifest.json" />
  <link rel="apple-touch-icon" href="/icons/zedevents.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Events" />
  <style>
    :root {
      --bg: #F4F1EC;
      --card: #FFFFFF;
      --border: #E2E0DC;
      --text: #211D1A;
      --subtext: #5C5955;
      --orange: #C2410C;
      --orange-hot: #EA580C;
      --cream: #FFF3E8;
      --peach: #FFD8B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 72px;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .sticky-header { position: sticky; top: 0; z-index: 100; background: var(--bg); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .topbar {
      background: var(--orange);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .gear {
      background: none; border: none; color: var(--cream);
      cursor: pointer; text-align: center; flex-shrink: 0;
    }
    .gear .icon { font-size: 22px; line-height: 1; }
    .gear .label { font-size: 9px; color: var(--peach); margin-top: 2px; }
    .brand { color: var(--cream); font-size: 20px; font-weight: 700; }
    .brand-sub { color: var(--peach); font-size: 12px; margin-top: 2px; }
    .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
    .auth-btn {
      display: inline-flex; align-items: center; gap: 6px;
      min-height: 34px; padding: 0 12px; border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.12);
      color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .dl-btn {
      min-height: 30px; padding: 0 12px; border-radius: 999px; border: 0;
      background: #fff; color: #C2410C; font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .dl-btn:disabled { opacity: 0.65; }
    .icon-row { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 18px;
      background: rgba(255,255,255,0.18); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; color: #fff;
    }
    .icon-btn svg {
      width: 18px; height: 18px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .thumb-ph {
      width: 42px; height: 42px; border-radius: 10px; border: 1.5px dashed #E2B48A;
      color: #C2410C; opacity: 0.55;
    }
    .thumb-ph svg {
      width: 100%; height: 100%; stroke: currentColor; fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      padding: 8px;
    }
    .badge {
      position: absolute; top: -4px; right: -4px;
      background: #DC2626; border-radius: 8px; min-width: 16px; height: 16px;
      color: #fff; font-size: 9px; font-weight: 700;
      display: none; align-items: center; justify-content: center; padding: 0 3px;
    }

    .search-row { padding: 12px; }
    .search-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; font-size: 14px; color: var(--text);
      outline: none;
    }
    .chips-row {
      display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 10px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px;
      padding: 7px 14px; font-size: 13px; white-space: nowrap; cursor: pointer; flex-shrink: 0;
      color: var(--text);
    }
    .chip.active {
      background: var(--orange-hot); border-color: var(--orange-hot);
      color: #fff; font-weight: 600;
    }

    .grid {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 4px 12px 24px;
    }
    .card {
      width: calc(50% - 5px);
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; cursor: pointer;
    }
    .thumb {
      height: 150px; background: #FBEAD9;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 10px; }
    .card-cat {
      font-size: 10px; font-weight: 700; color: var(--orange);
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .title {
      font-size: 13px; font-weight: 600; color: var(--text);
      margin: 4px 0; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .price { font-size: 13px; font-weight: 700; color: var(--orange); }
    .vendor { font-size: 11px; color: var(--subtext); margin-top: 3px; }
    .distance { font-size: 10px; color: var(--orange-hot); font-weight: 600; margin-top: 2px; }
    .status { text-align: center; padding: 60px 20px; color: var(--subtext); }
  </style>
</head>
<body data-nav-active="home">
  <div class="sticky-header">
    <div class="topbar">
      <div class="topbar-left">
        <button class="gear" type="button" id="menuBtn" aria-label="Menu">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </div>
          <div class="label">Menu</div>
        </button>
        <div>
          <div class="brand">ZedEvents</div>
          <div class="brand-sub" id="greet">Event services near you</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="dl-btn" type="button" id="appDownloadBtn">Download</button>
        <button class="auth-btn" type="button" id="authBtn">Login / Sign Up</button>
        <div class="icon-row">
          <button class="icon-btn" type="button" id="mapBtn" aria-label="Map">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3.5v17l-5 2V5.5z"/><path d="M9 3.5 15 5.5v17l-6-2z"/><path d="M15 5.5 20 3.5v17l-5 2z"/></svg>
          </button>
          <button class="icon-btn" type="button" id="favBtn" aria-label="Favorites">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
          <button class="icon-btn" type="button" id="chatBtn" aria-label="Chats">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="badge" id="chatBadge"></span>
          </button>
          <button class="icon-btn" type="button" id="postBtn" aria-label="Post">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="search-row">
      <input class="search-input" id="search" type="search" placeholder="Search catering, DJs, tents..." />
    </div>
    <div class="chips-row" id="cats">
      <button type="button" class="chip active" data-id="">All</button>
      <button type="button" class="chip" data-id="__nearby__">Nearby</button>
    </div>
  </div>

  <div id="status" class="status">Loading services…</div>
  <div class="grid" id="grid" hidden></div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script src="/events/js/location.js"></script>
  <script src="/events/js/bottom-nav.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const catsEl = document.getElementById("cats");
    const search = document.getElementById("search");
    let services = [];
    let activeCategory = "";
    let sortNearby = false;
    let myCoords = ZELocation.getSavedCoords();

    function goLogin(next) {
      if (!ZEAuth.requireLogin(next)) return false;
      location.href = next;
      return true;
    }

    document.getElementById("menuBtn").onclick = () => goLogin("/settings.html");
    document.getElementById("favBtn").onclick = () => goLogin("/favorites.html");
    document.getElementById("chatBtn").onclick = () => goLogin("/chats.html");
    document.getElementById("postBtn").onclick = () => goLogin("/post-service.html");
    document.getElementById("mapBtn").onclick = () => { location.href = "/events/map-view.html"; };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function paintAuth() {
      const user = ZEAuth.getUser();
      const greet = document.getElementById("greet");
      const authBtn = document.getElementById("authBtn");
      if (user) {
        greet.textContent = `Hi, ${user.name || "there"}`;
        authBtn.textContent = user.name || "Account";
        authBtn.onclick = () => { location.href = "/events/settings.html"; };
        loadUnread();
      } else {
        authBtn.onclick = () => { location.href = "/events/login.html"; };
      }
    }

    async function loadUnread() {
      try {
        const data = await ZE.api("/messages/unread-count");
        const badge = document.getElementById("chatBadge");
        const n = data.count || 0;
        if (n > 0) {
          badge.style.display = "flex";
          badge.textContent = n > 9 ? "9+" : String(n);
        }
      } catch { /* ignore */ }
    }

    function formatDistance(km) {
      if (km == null) return "";
      if (km < 1) return `${Math.round(km * 1000)} m away`;
      return `${km.toFixed(km < 10 ? 1 : 0)} km away`;
    }

    function withDistance(list) {
      if (!myCoords) return list.map((item) => ({ ...item, distanceKm: null }));
      return list.map((item) => {
        const lat = parseFloat(item.latitude);
        const lng = parseFloat(item.longitude);
        const distanceKm = Number.isFinite(lat) && Number.isFinite(lng)
          ? ZELocation.getDistanceKm(myCoords.lat, myCoords.lng, lat, lng)
          : null;
        return { ...item, distanceKm };
      });
    }

    function renderCards(list) {
      let rows = withDistance(list);
      if (sortNearby && myCoords) {
        rows = rows.slice().sort((a, b) => {
          if (a.distanceKm == null && b.distanceKm == null) return 0;
          if (a.distanceKm == null) return 1;
          if (b.distanceKm == null) return -1;
          return a.distanceKm - b.distanceKm;
        });
      }

      if (!rows.length) {
        grid.hidden = true;
        status.hidden = false;
        status.textContent = search.value.trim()
          ? "No services match your search."
          : sortNearby && !myCoords
            ? "Turn on location to see nearby services."
            : "No services posted yet.";
        return;
      }
      status.hidden = true;
      grid.hidden = false;
      grid.innerHTML = rows.map((item) => {
        const photo = ZE.firstPhoto(item.photos);
        const vendor = item.business_name || item.vendor_name || "Vendor";
        const dist = formatDistance(item.distanceKm);
        const img = photo
          ? `<img src="${photo}" alt="" loading="lazy" />`
          : `<div class="thumb-ph" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 16-5-5-4 4-2-2-5 5"/></svg></div>`;
        return `
          <a class="card" href="/events/service.html?id=${item.id}">
            <div class="thumb">${img}</div>
            <div class="card-info">
              <div class="card-cat">${escapeHtml(item.category || "Service")}</div>
              <div class="title">${escapeHtml(item.title || "Untitled")}</div>
              <div class="price">${ZE.formatPrice(item.price)}</div>
              ${dist ? `<div class="distance">${escapeHtml(dist)}</div>` : ""}
              <div class="vendor">${escapeHtml(vendor)}</div>
            </div>
          </a>`;
      }).join("");
    }

    function applyFilter() {
      const q = search.value.trim().toLowerCase();
      let filtered = services.filter((item) => {
        if (!q) return true;
        const blob = `${item.title || ""} ${item.description || ""} ${item.business_name || ""} ${item.vendor_name || ""} ${item.category || ""}`.toLowerCase();
        return blob.includes(q);
      });
      if (sortNearby && myCoords) {
        filtered = filtered.filter((item) => {
          const lat = parseFloat(item.latitude);
          const lng = parseFloat(item.longitude);
          return Number.isFinite(lat) && Number.isFinite(lng);
        });
      }
      renderCards(filtered);
    }

    async function loadCategories() {
      try {
        const cats = await ZE.api("/services/categories");
        cats.forEach((c) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "chip";
          btn.dataset.id = c.id;
          btn.textContent = c.name;
          catsEl.appendChild(btn);
        });
      } catch { /* ignore */ }
    }

    async function loadServices() {
      status.hidden = false;
      status.textContent = "Loading services…";
      grid.hidden = true;
      try {
        const path = activeCategory && activeCategory !== "__nearby__"
          ? `/services?category_id=${encodeURIComponent(activeCategory)}`
          : "/services";
        services = await ZE.api(path);
        applyFilter();
      } catch {
        status.hidden = false;
        grid.hidden = true;
        status.textContent = "Could not load services.";
      }
    }

    catsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      catsEl.querySelectorAll(".chip").forEach((el) => el.classList.remove("active"));
      btn.classList.add("active");
      const id = btn.dataset.id || "";
      sortNearby = id === "__nearby__";
      activeCategory = sortNearby ? "" : id;
      if (sortNearby && !myCoords) {
        ZELocation.getDeviceCoords()
          .then((coords) => {
            myCoords = coords;
            ZELocation.saveCoords(coords);
            loadServices();
          })
          .catch(() => loadServices());
        return;
      }
      loadServices();
    });

    search.addEventListener("input", applyFilter);
    paintAuth();
    loadCategories();
    if (!myCoords) {
      ZELocation.getDeviceCoords()
        .then((coords) => {
          myCoords = coords;
          ZELocation.saveCoords(coords);
          if (services.length) applyFilter();
        })
        .catch(() => {});
    }
    loadServices();
  </script>
  <script src="/install-app.js"></script>
  <script>
    NexusInstall.wireAppInstall({ btn: '#appDownloadBtn', name: 'Events' });
  </script>
</body>
</html>
