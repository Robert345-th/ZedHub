<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents - Messages</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C;
      --cream: #FFF3E8; --peach: #FFD8B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 24px;
    }
    a { color: inherit; text-decoration: none; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--orange); padding: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-button {
      width: 40px; height: 40px; padding: 0; background: none; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .back-button svg {
      width: 22px; height: 22px; stroke: var(--cream); fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-title { color: var(--cream); font-size: 18px; font-weight: 700; }
    .header-sub { color: var(--peach); font-size: 12px; margin-top: 2px; }
    .center-box {
      padding: 60px 24px; text-align: center; color: var(--subtext);
      font-size: 14px; line-height: 1.45;
    }
    .list { padding: 12px; }
    .chat-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; margin-bottom: 8px;
    }
    .chat-avatar {
      width: 48px; height: 48px; border-radius: 24px; flex-shrink: 0;
      background: var(--cream); color: var(--orange);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px;
    }
    .chat-row-main { flex: 1; min-width: 0; }
    .chat-row-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-row-preview {
      font-size: 12px; color: var(--subtext); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-row-meta { text-align: right; flex-shrink: 0; }
    .chat-row-time { font-size: 10px; color: var(--subtext); }
    .unread {
      display: inline-block; margin-top: 4px; min-width: 18px; height: 18px;
      padding: 0 5px; border-radius: 9px; background: var(--orange);
      color: #fff; font-size: 10px; font-weight: 700; line-height: 18px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="back-button" type="button" onclick="location.href='/events/'" aria-label="Go back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div>
      <div class="header-title">Messages</div>
      <div class="header-sub">Chats with vendors and customers</div>
    </div>
  </div>

  <div id="status" class="center-box">Loading chats…</div>
  <div class="list" id="list" hidden></div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script>
    if (!ZEAuth.requireLogin("/chats.html")) {
      /* redirected */
    } else {
      const user = ZEAuth.getUser();
      const status = document.getElementById("status");
      const list = document.getElementById("list");

      function esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function formatTime(dateString) {
        const date = new Date(dateString);
        const now = new Date();
        if (date.toDateString() === now.toDateString()) {
          return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }
        return date.toLocaleDateString([], { month: "short", day: "numeric" });
      }

      (async () => {
        try {
          const conversations = await ZE.api("/messages/conversations");
          if (!conversations.length) {
            status.textContent = "No conversations yet. Open a service and tap Message vendor to start chatting.";
            return;
          }
          status.hidden = true;
          list.hidden = false;
          list.innerHTML = conversations.map((conv) => {
            const isMine = conv.sender_id === user.id;
            let preview = isMine ? `You: ${conv.last_message || ""}` : (conv.last_message || "");
            if (conv.last_photo_url) preview = "Photo";
            if (conv.last_audio_url) preview = "Voice note";
            const unread = parseInt(conv.unread_count, 10) || 0;
            const initial = (conv.other_user_name || "?").charAt(0).toUpperCase();
            return `
              <a class="chat-row" href="/events/chat.html?userId=${conv.other_user_id}">
                <div class="chat-avatar">${esc(initial)}</div>
                <div class="chat-row-main">
                  <div class="chat-row-name">${esc(conv.other_user_name || "User")}</div>
                  <div class="chat-row-preview">${esc(preview || " ")}</div>
                </div>
                <div class="chat-row-meta">
                  <div class="chat-row-time">${esc(formatTime(conv.last_sent_at))}</div>
                  ${unread > 0 ? `<span class="unread">${unread > 9 ? "9+" : unread}</span>` : ""}
                </div>
              </a>`;
          }).join("");
        } catch {
          status.textContent = "Could not load chats.";
        }
      })();
    }
  </script>
</body>
</html>
