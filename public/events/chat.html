<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZedEvents - Chat</title>
  <meta name="theme-color" content="#C2410C" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #F4F1EC; --card: #FFFFFF; --border: #E2E0DC;
      --text: #211D1A; --subtext: #5C5955; --orange: #C2410C;
      --cream: #FFF3E8; --peach: #FFD8B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { height: 100%; overflow-y: auto; overscroll-behavior: none; }
    html, body { height: 100%; overscroll-behavior: none;}
    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; height: 100vh; height: 100dvh; overscroll-behavior: none;}
    button, input { font: inherit; }
    .topbar {
      flex-shrink: 0; background: var(--orange); padding: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .back-button {
      width: 40px; height: 40px; padding: 0; background: none; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .back-button svg {
      width: 22px; height: 22px; stroke: var(--cream); fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-title { color: var(--cream); font-size: 17px; font-weight: 700; }
    .header-sub { color: var(--peach); font-size: 11px; margin-top: 2px; }
    .quick-replies {
      flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto;
      padding: 10px 12px; scrollbar-width: none;
    }
    .quick-replies::-webkit-scrollbar { display: none; }
    .quick-replies button {
      flex-shrink: 0; background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 600;
      color: var(--text); cursor: pointer;
    }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .status { text-align: center; color: var(--subtext); padding: 24px; font-size: 14px; }
    .bubble {
      max-width: 82%; padding: 10px 12px; border-radius: 14px;
      font-size: 14px; line-height: 1.4; word-break: break-word;
    }
    .bubble.me {
      align-self: flex-end; background: var(--orange); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.them {
      align-self: flex-start; background: var(--card); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bubble img {
      max-width: 100%; border-radius: 10px; margin-bottom: 6px; display: block;
    }
    .bubble-time {
      display: block; font-size: 10px; opacity: 0.75; margin-top: 4px; text-align: right;
    }
    .chat-compose {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      background: var(--card); border-top: 1px solid var(--border);
    }
    .photo-btn {
      width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0;
      background: var(--cream); border: 1px solid #F0D2A8; color: var(--orange);
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .chat-compose input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-radius: 999px; padding: 11px 14px; font-size: 14px;
    }
    .send-btn {
      flex-shrink: 0; background: var(--orange); border: none; border-radius: 999px;
      padding: 11px 16px; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
    }
  </style>
  <script src="/no-ptr.js"></script>
</head>
<body>
  <div class="topbar">
    <button class="back-button" type="button" onclick="location.href='/events/chats.html'" aria-label="Back to chats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div>
      <div class="header-title" id="otherName">Chat</div>
      <div class="header-sub">Messages</div>
    </div>
  </div>

  <div class="quick-replies" id="quick"></div>
  <div class="chat-messages" id="messages">
    <div class="status" id="status">Loadingù</div>
  </div>
  <div class="chat-compose">
    <label class="photo-btn" aria-label="Send photo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 16-5-5-4 4-2-2-5 5"/></svg>
      <input id="photoInput" type="file" accept="image/*" hidden />
    </label>
    <input id="text" type="text" placeholder="Type a messageù" />
    <button class="send-btn" type="button" id="sendBtn">Send</button>
  </div>

  <script src="/events/js/api.js"></script>
  <script src="/events/js/auth.js"></script>
  <script src="/events/js/ui.js"></script>
  <script>
    if (!ZEAuth.requireLogin(location.pathname + location.search)) {
      /* redirected */
    } else {
      const user = ZEAuth.getUser();
      const otherId = new URLSearchParams(location.search).get("userId");
      const messagesEl = document.getElementById("messages");
      const status = document.getElementById("status");
      const textInput = document.getElementById("text");
      let sending = false;

      if (!otherId) {
        status.textContent = "Missing chat user.";
      } else {
        const customerReplies = [
          "Is this still available?",
          "Can you do a better price?",
          "What's included in this package?",
          "Can I see more photos?",
        ];
        const vendorReplies = [
          "Still available for that date",
          "Price is negotiable",
          "Fully booked, sorry",
          "I'll send more photos",
        ];
        const replies = user.is_vendor ? vendorReplies : customerReplies;
        document.getElementById("quick").innerHTML = replies
          .map((t) => `<button type="button" data-text="${t.replace(/"/g, "&quot;")}">${t}</button>`)
          .join("");

        async function loadOther() {
          try {
            const info = await ZE.api(`/auth/user-info/${otherId}`);
            document.getElementById("otherName").textContent = info.display_name || info.name || "Chat";
          } catch { /* ignore */ }
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function renderMessages(rows, forceScroll) {
          if (!rows.length) {
            messagesEl.innerHTML = `<div class="status">Say hello to start the chat.</div>`;
            return;
          }
          const nearBottom =
            messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
          messagesEl.innerHTML = rows.map((m) => {
            const mine = m.sender_id === user.id;
            const time = new Date(m.sent_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            let body = "";
            if (m.photo_url) body += `<img src="${escapeHtml(m.photo_url)}" alt="" loading="lazy" />`;
            if (m.content) body += `<div>${escapeHtml(m.content)}</div>`;
            if (m.audio_url) body += `<div>Voice note</div>`;
            return `<div class="bubble ${mine ? "me" : "them"}">${body}<span class="bubble-time">${time}</span></div>`;
          }).join("");
          if (forceScroll || nearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        let lastSig = "";
        async function loadMessages(showStatus) {
          try {
            const data = await ZE.api(`/messages/conversation/${otherId}`);
            if (status && status.parentNode) status.remove();
            const rows = data.messages || [];
            const sig = rows.map((m) => m.id).join(",") + ":" + rows.length;
            if (sig === lastSig) return;
            const isFirst = !lastSig;
            lastSig = sig;
            renderMessages(rows, isFirst);
          } catch {
            if (showStatus && status && status.parentNode) {
              status.textContent = "Could not load messages.";
            }
          }
        }

        async function sendPayload(payload) {
          if (sending) return;
          sending = true;
          try {
            await ZE.api("/messages", {
              method: "POST",
              body: JSON.stringify({ receiver_id: Number(otherId), ...payload }),
            });
            lastSig = "";
            await loadMessages(false);
          } catch (err) {
            ZEUI.error(err.message || "Could not send.");
          } finally {
            sending = false;
          }
        }

        document.getElementById("sendBtn").addEventListener("click", async () => {
          const content = textInput.value.trim();
          if (!content) return;
          textInput.value = "";
          await sendPayload({ content });
        });

        textInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            document.getElementById("sendBtn").click();
          }
        });

        document.getElementById("quick").addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-text]");
          if (!btn) return;
          sendPayload({ content: btn.dataset.text });
        });

        document.getElementById("photoInput").addEventListener("change", async (e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!file) return;
          try {
            const url = await ZE.uploadImage(file);
            await sendPayload({ photo_url: url });
          } catch (err) {
            ZEUI.error(err.message || "Photo upload failed.");
          }
        });

        loadOther();
        loadMessages(true);
        let poll = setInterval(() => loadMessages(false), 4000);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            clearInterval(poll);
            poll = null;
          } else if (!poll) {
            loadMessages(false);
            poll = setInterval(() => loadMessages(false), 4000);
          }
        });
      }
    }
  </script>
</body>
</html>
